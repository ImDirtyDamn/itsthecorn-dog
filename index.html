<!DOCTYPE html>
<!--
  DRAW RATE TRACKER v5 - single self-contained offline file (no network, no CDN).
  v5: downtime comes off the target and pace car by weight (see DOWNTIME below).

  SAVED DATA  (localStorage key "drawRateV5", shared by this page and the phone app at /app/;
  the v4 key "drawRateV4" and the older "drawRateMulti" are read once for import and never modified). The same shape is used for the JSON export,
  plus "exportedAt" and a computed "summary". Every record has a string id and
  ISO-8601 timestamps so it can be loaded straight into a database.

  {
    "schema": "draw-rate/v5",
    "setupDone": true,                    // false = show the setup wizard
    "shift": {                            // table: shifts
      "id": "s_lx2k9a_ab12c",
      "date": "2026-10-21",               // shift START date (YYYY-MM-DD, local)
      "operator": "D. Smith / 1234",      // optional
      "start": "06:00",                   // HH:MM local, 24h
      "end": "18:00",                     // end <= start means it ends next morning
      "breakMode": "total" | "list",
      "breakTotalMin": 30,                // used when breakMode = "total"
      "breaks": [ { "id": "b_...", "start": "12:00", "minutes": 30 } ],  // breakMode = "list"
      "createdAt": "2026-10-21T10:00:00.000Z",
      "updatedAt": "2026-10-21T10:05:00.000Z"
    },
    "machines": [                         // table: machines (FK shift.id)
      { "id": "m_...", "slot": 1, "name": "Machine 1", "needRate": 2800,   // lb/hr
        "timerStartedAt": null | ISO, "timerAccumMs": 0 }                 // optional run timer
    ],
    "coils": [                            // table: coils (FK machines.id)
      { "id": "c_...", "machineId": "m_...", "loggedAt": ISO, "weight": 450.5,  // lb
        "coilNo": "", "heatNo": "", "size": "", "notes": "",
        "downtimeMin": null | number, "downtimeReason": "" }
    ],
    "downtime": [                         // table: downtime (FK machines.id, or "all")
      { "id": "d_...", "machineId": "m_..." | "all", "loggedAt": ISO,
        "startAt": ISO, "endAt": ISO | null,    // null = still down (running)
        "minutes": 15 | null, "reason": "" }   // minutes = endAt - startAt (null while running)
    ],                                    // coil.downtimeMin is a note only; it does not change totals
    "settings": {                         // per device, kept across shifts
      "confirmUnderLb": 3000,             // ask "is that right?" for a coil under this
      "confirmOverLb": 5000               // ask "coil weight, not the coil ID?" for a coil over this
    }
  }

  The math lives in one place: the "CALC MODULE" in the script below. The same formulas are
  re-implemented independently in Python (drtest/calc_check.py) to cross-check them.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030a03">
<title>Draw Rate Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23030a03'/%3E%3Cpath d='M5 23 L12 15 L17 19 L27 8' stroke='%2339ff6a' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #030a03;
    --panel: #061206;
    --fg: #39ff6a;
    --fg-dim: #1f9a3e;
    --fg-faint: rgba(57, 255, 106, 0.16);
    --amber: #ffc23d;
    --red: #ff5f56;
    --white: #eaffea;
    --font: "Courier New", Courier, "Noto Sans Mono", "DejaVu Sans Mono", "Droid Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); }
  body { line-height: 1.4; }
  [hidden] { display: none !important; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  .wrap { max-width: 46rem; margin: 0 auto; padding: 1rem 1rem 3rem; }
  .glow { text-shadow: 0 0 6px rgba(57, 255, 106, 0.45); }
  .amber { color: var(--amber); }
  .red { color: var(--red); }
  .green { color: var(--fg); }
  .white { color: var(--white); }
  .dim { color: var(--fg-dim); }
  .lbl { color: var(--amber); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; }
  .sub { color: var(--fg-dim); font-size: 0.85rem; }
  .err { color: var(--red); min-height: 1.3em; margin: 0.75rem 0 0; }

  /* inputs + buttons */
  .in {
    width: 100%; min-width: 0; height: 3.25rem; padding: 0 0.85rem;
    background: #000; color: var(--white); border: 2px solid var(--fg-dim); border-radius: 3px;
    font-size: 1.25rem; font-variant-numeric: tabular-nums; color-scheme: dark;
    -webkit-appearance: none; appearance: none;
  }
  .in:focus { outline: none; border-color: var(--fg); box-shadow: 0 0 10px rgba(57, 255, 106, 0.35); }
  .in::placeholder { color: rgba(57, 255, 106, 0.35); }
  textarea.in { height: auto; padding: 0.6rem 0.85rem; font-size: 1rem; }
  .btn {
    min-height: 3.25rem; padding: 0.5rem 1rem; border: 2px solid var(--fg); border-radius: 3px;
    background: transparent; color: var(--fg); font-weight: 700; letter-spacing: 0.08em;
    cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .btn:active { background: var(--fg); color: #000; }
  .btn.solid { background: var(--fg); color: #000; }
  .btn.solid:active { background: var(--white); }
  .btn.warn { border-color: var(--red); color: var(--red); }
  .btn.small { min-height: 2.5rem; padding: 0.3rem 0.7rem; font-size: 0.85rem; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .link { background: none; border: 0; color: var(--amber); text-decoration: underline; cursor: pointer; padding: 0.5rem; font-size: 0.9rem; }

  /* wizard */
  .wz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .wz-brand { color: var(--amber); font-weight: 700; letter-spacing: 0.2em; }
  .wz-step { color: var(--fg-dim); font-size: 0.85rem; letter-spacing: 0.1em; }
  .wz-progress { height: 4px; background: var(--fg-faint); margin-bottom: 2rem; }
  .wz-progress > div { height: 100%; background: var(--fg); width: 0; }
  #wz-title { color: var(--white); font-size: 1.5rem; margin: 0 0 0.5rem; letter-spacing: 0.04em; }
  .help { color: var(--fg-dim); margin: 0 0 1.5rem; }
  .field { margin-bottom: 1.25rem; }
  .field > label { display: block; margin-bottom: 0.4rem; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 1.25rem; }
  .seg .btn.on { background: var(--fg); color: #000; }
  .count-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
  .count-grid .btn { min-height: 4.5rem; font-size: 1.75rem; }
  .count-grid .btn.on { background: var(--fg); color: #000; }
  .break-row { display: grid; grid-template-columns: 1fr 7rem 3.25rem; gap: 0.5rem; margin-bottom: 0.6rem; align-items: end; }
  .mach-row { padding: 1rem 0; border-top: 1px solid var(--fg-faint); }
  .mach-row:first-child { border-top: 0; padding-top: 0; }
  .wz-nav { display: grid; grid-template-columns: 1fr 2fr; gap: 0.75rem; margin-top: 2rem; }
  .calc-note { margin-top: 0.5rem; color: var(--amber); }
  .review { width: 100%; border-collapse: collapse; }
  .review td { padding: 0.55rem 0; border-bottom: 1px solid var(--fg-faint); vertical-align: top; }
  .review td:first-child { color: var(--amber); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; width: 40%; }
  .review td:last-child { color: var(--white); text-align: right; }

  /* dashboard */
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .brand { color: var(--amber); font-weight: 700; letter-spacing: 0.2em; font-size: 1.1rem; }
  .clock { color: var(--white); font-size: 1.1rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .phase { margin: 1rem 0 1.5rem; padding: 0.5rem 0.75rem; background: var(--panel); color: var(--fg); font-size: 0.9rem; letter-spacing: 0.05em; }
  .phase.amber { color: var(--amber); }
  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .big { font-size: 2.6rem; font-weight: 700; line-height: 1.1; color: var(--white); font-variant-numeric: tabular-nums; margin-top: 0.2rem; overflow-wrap: anywhere; }
  .big.pc { color: var(--fg); }
  .unit { font-size: 0.85rem; color: var(--fg-dim); }
  .bar { position: relative; height: 10px; background: var(--fg-faint); margin: 1.25rem 0 0.4rem; }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--fg); width: 0; }
  .bar .mark { position: absolute; top: -5px; bottom: -5px; width: 3px; background: var(--amber); left: 0; margin-left: -1px; }
  .legend { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.8rem; color: var(--fg-dim); }
  .block { margin-top: 2rem; }
  .block > .lbl { display: block; margin-bottom: 0.6rem; }
  .delta { font-size: 2.1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .delta .pct { font-size: 1.5rem; margin-left: 0.75rem; }
  .rows { margin: 0; }
  .rows > div { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 0.6rem 0; border-bottom: 1px solid var(--fg-faint); }
  .rows > div:last-child { border-bottom: 0; }
  .rows dt { color: var(--fg-dim); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .rows dd { margin: 0; color: var(--white); font-size: 1.15rem; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .rows dd.green, .mc-stats b.green { color: var(--fg); }
  .rows dd.amber, .mc-stats b.amber { color: var(--amber); }
  .rows dd.red, .mc-stats b.red { color: var(--red); }
  .note { color: var(--amber); font-size: 0.85rem; margin: 0.6rem 0 0; }
  .machines { display: grid; grid-template-columns: 1fr; gap: 1rem; }
  .mc { background: var(--panel); padding: 1rem; border-left: 3px solid var(--fg-dim); }
  .mc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; margin-bottom: 0.75rem; }
  .mc-name { color: var(--white); font-weight: 700; font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .mc-rate { color: var(--fg-dim); font-size: 0.8rem; white-space: nowrap; }
  .mc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.9rem; }
  .mc-stats b { display: block; color: var(--white); font-size: 1.2rem; font-variant-numeric: tabular-nums; margin-top: 0.15rem; }
  .mc-log { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; }
  .mc-log .in::placeholder { font-size: 0.85em; }
  .wt-lbl { display: block; font-size: 0.75rem; letter-spacing: 0.12em; color: var(--white); margin: 0.6rem 0 0.3rem; font-weight: 700; }
  .mc-log .btn { padding: 0.5rem 1.1rem; }
  .mc-last { margin-top: 0.5rem; min-height: 1.2em; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 2.5rem; }
  .adv-toggle { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--fg-faint); border-bottom: 1px solid var(--fg-faint); color: var(--amber); padding: 1rem 0; letter-spacing: 0.15em; font-weight: 700; cursor: pointer; }

  /* advanced */
  .adv-mach { margin-top: 1.5rem; }
  .adv-mach h3 { color: var(--white); font-size: 1rem; margin: 0 0 0.6rem; letter-spacing: 0.06em; }
  .adv-line { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
  .coil-tbl { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  .coil-tbl th { color: var(--amber); font-weight: 400; font-size: 0.7rem; letter-spacing: 0.1em; text-align: left; padding: 0.3rem 0.25rem; border-bottom: 1px solid var(--fg-faint); }
  .coil-tbl td { padding: 0.45rem 0.25rem; border-bottom: 1px solid var(--fg-faint); vertical-align: top; }
  .coil-tbl td.r, .coil-tbl th.r { text-align: right; }
  .coil-tbl .meta { color: var(--fg-dim); font-size: 0.8rem; }
  .edit-box { background: var(--panel); padding: 0.75rem; }
  .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .edit-grid .full { grid-column: 1 / -1; }
  .edit-grid .in { height: 2.75rem; font-size: 1rem; }
  .dt-form { display: grid; grid-template-columns: 6rem 1fr auto; gap: 0.5rem; }
  .dt-form .in { height: 2.75rem; font-size: 1rem; }
  .export { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .empty { color: var(--fg-dim); padding: 0.6rem 0; }
  .text-center { text-align: center; }

  @media (min-width: 640px) {
    .wrap { padding: 1.75rem 1.75rem 3rem; }
    .big { font-size: 3.6rem; }
    .delta { font-size: 2.6rem; }
    .machines { grid-template-columns: 1fr 1fr; }
    .count-grid { grid-template-columns: repeat(6, 1fr); }
  }
  @media (max-width: 360px) {
    .big { font-size: 2.1rem; }
    .delta { font-size: 1.7rem; }
    .delta .pct { font-size: 1.2rem; }
  }
  /* downtime */
  .down-line { display: flex; flex-direction: column; gap: 0.2rem; margin-top: 0.6rem; color: var(--amber); font-size: 0.9rem; }
  .down-line .red { color: var(--red); font-weight: 700; }
  .mc-down { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; align-items: center; margin-top: 0.6rem; }
  .mc-down-txt { font-size: 0.85rem; color: var(--amber); }
  .mc-down-txt.red { color: var(--red); font-weight: 700; }
  .mc.down { border-left-color: var(--red); }
  #dtp { padding-bottom: 1rem; }
  #dtp h3 { color: var(--white); font-size: 1rem; margin: 1.5rem 0 0.6rem; letter-spacing: 0.06em; }
  #dtp .btn.full { width: 100%; }
  select.in { background: #000; }
  .dt-past { display: grid; grid-template-columns: 5rem minmax(0, 1fr) auto; gap: 0.5rem; align-items: end; }
  .dt-past .field { margin-bottom: 0; }
  .dt-past .in { height: 3rem; font-size: 1.1rem; }
  .dt-entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; align-items: center; padding: 0.55rem 0; border-bottom: 1px solid var(--fg-faint); font-size: 0.9rem; color: var(--white); }
  .dt-entry.run { color: var(--red); font-weight: 700; }
  .dt-tot > div { display: flex; justify-content: space-between; gap: 0.75rem; padding: 0.4rem 0; border-bottom: 1px solid var(--fg-faint); font-size: 0.95rem; }
  .dt-tot > div span:last-child { color: var(--amber); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .dt-tot > div.all span:last-child { color: var(--white); }
  /* fat-finger: confirm, readback, recent coils */
  .top-r { display: flex; flex-direction: column; align-items: flex-end; gap: 0.4rem; }
  #rc-open { min-height: 3rem; font-size: 0.8rem; letter-spacing: 0.06em; padding: 0.3rem 0.6rem; }
  .ask { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.82); display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .ask-box { width: 100%; max-width: 28rem; background: var(--panel); border: 2px solid var(--amber); padding: 1.25rem; }
  .ask-msg { color: var(--white); font-size: 1.3rem; line-height: 1.35; margin: 0 0 1.25rem; font-weight: 700; }
  .ask-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .ask-btns .btn { min-height: 3.75rem; font-size: 1.1rem; text-transform: none; padding: 0.4rem 0.5rem; white-space: nowrap; }
  @media (max-width: 380px) { .ask-btns .btn { font-size: 1rem; } .ask-box { padding: 1rem; } }
  .readback { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(1rem + env(safe-area-inset-bottom)); z-index: 40;
              width: calc(100% - 2rem); max-width: 30rem; background: #000; border: 2px solid var(--fg); box-shadow: 0 0 24px rgba(57, 255, 106, 0.35); padding: 0.75rem 1rem; }
  .readback.undone { border-color: var(--amber); }
  .rb-top { display: flex; justify-content: space-between; gap: 0.75rem; font-size: 0.85rem; letter-spacing: 0.1em; }
  .rb-lbl { color: var(--fg); font-weight: 700; } .rb-mach { color: var(--white); text-align: right; overflow-wrap: anywhere; }
  .rb-w { font-size: clamp(2.4rem, 11vw, 3.4rem); font-weight: 700; color: var(--white); line-height: 1.1; margin: 0.2rem 0 0.5rem; font-variant-numeric: tabular-nums; text-shadow: 0 0 8px rgba(57, 255, 106, 0.5); }
  .rb-act { display: grid; grid-template-columns: 1fr 1.4fr 0.8fr; gap: 0.5rem; }
  .rb-act .btn { min-height: 3rem; padding: 0.3rem 0.4rem; font-size: 0.95rem; }
  #rcp { padding-bottom: 1rem; }
  .rc-filter { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.75rem 0; }
  .rc-filter .btn { min-height: 3rem; padding: 0.3rem 0.8rem; }
  .rc-filter .btn.on { background: var(--fg); color: #000; border-color: var(--fg); }
  .rc-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 0.5rem; align-items: center; padding: 0.55rem 0; border-bottom: 1px solid var(--fg-faint); }
  .rc-row .rc-w { color: var(--white); font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rc-row .rc-meta { display: block; color: var(--fg-dim); font-size: 0.85rem; }
  .rc-row.hl { background: rgba(57, 255, 106, 0.08); }
  .rc-edit { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.5rem; align-items: end; padding: 0.5rem 0 0.25rem; }
  .rc-edit .field { margin-bottom: 0; }
  .rc-edit .in { height: 3rem; }
  .rc-edit .rc-btns { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .rc-edit .err { grid-column: 1 / -1; margin: 0; }
</style>
</head>
<body>
<div class="wrap">

  <section id="wizard" hidden>
    <div class="wz-top">
      <span class="wz-brand glow">DRAW RATE</span>
      <span class="wz-step" id="wz-step"></span>
    </div>
    <div class="wz-progress"><div id="wz-bar"></div></div>
    <h2 id="wz-title"></h2>
    <p id="wz-help" class="help"></p>
    <div id="wz-body"></div>
    <p id="wz-error" class="err" role="alert"></p>
    <div class="wz-nav">
      <button type="button" class="btn" id="wz-back">BACK</button>
      <button type="button" class="btn solid" id="wz-next">NEXT</button>
    </div>
    <p class="text-center"><button type="button" class="link" id="wz-cancel" hidden>Cancel, back to dashboard</button></p>
  </section>

  <section id="dash" hidden>
    <header class="top">
      <div>
        <div class="brand glow">DRAW RATE</div>
        <div class="sub" id="d-shift"></div>
      </div>
      <div class="top-r">
        <div class="clock" id="d-clock"></div>
        <button type="button" class="btn small" id="rc-open">RECENT COILS</button>
      </div>
    </header>
    <p class="phase" id="d-phase"></p>

    <div class="hero">
      <div>
        <div class="lbl">Lbs ran</div>
        <div class="big glow" id="d-ran">0</div>
      </div>
      <div>
        <div class="lbl">Pace car</div>
        <div class="big pc glow" id="d-pc">0</div>
        <div class="unit">lb you should have by now</div>
      </div>
    </div>
    <div class="bar" aria-hidden="true"><div class="fill" id="d-fill"></div><div class="mark" id="d-mark"></div></div>
    <div class="legend"><span id="d-of-target"></span><span id="d-target"></span></div>
    <div class="down-line" id="d-down" hidden></div>

    <section class="block">
      <span class="lbl" id="d-delta-lbl">Deficit / surplus</span>
      <div class="delta" id="d-delta"><span id="d-delta-lb">—</span><span class="pct" id="d-delta-pct"></span></div>
      <div class="sub" id="d-delta-note"></div>
    </section>

    <section class="block">
      <span class="lbl">Projection at current pace</span>
      <dl class="rows">
        <div><dt>Current pace</dt><dd id="p-pace">—</dd></div>
        <div><dt>Projected finish</dt><dd id="p-proj">—</dd></div>
        <div><dt>vs day target</dt><dd id="p-vs">—</dd></div>
        <div><dt>Hit target at</dt><dd id="p-hit">—</dd></div>
        <div><dt>Catch-up rate</dt><dd id="p-catch">—</dd></div>
      </dl>
      <p class="note" id="p-note"></p>
    </section>

    <section class="block">
      <span class="lbl">Machines</span>
      <div class="machines" id="d-machines"></div>
    </section>

    <section class="block">
      <button type="button" class="adv-toggle" id="rc-toggle" aria-expanded="false">+ RECENT COILS</button>
      <div id="rcp" hidden></div>
      <button type="button" class="adv-toggle" id="dt-toggle" aria-expanded="false">+ DOWNTIME</button>
      <div id="dtp" hidden></div>
      <button type="button" class="adv-toggle" id="adv-toggle" aria-expanded="false">+ ADVANCED</button>
      <div id="adv" hidden></div>
    </section>

    <div class="actions">
      <button type="button" class="btn" id="btn-edit">EDIT SETUP</button>
      <button type="button" class="btn warn" id="btn-new">NEW SHIFT</button>
    </div>
  </section>

   Pure functions: no DOM, no storage. Mirrored in drtest/calc_check.py.

     shift window   start = shift.date @ shift.start

                            the shift ends the NEXT day (overnight).
     breaks         list mode : each break starts at its clock time inside the
                                window (a time earlier than the start time means
                                the next day) and lasts its minutes.
                    total mode: one block of breakTotalMin centred on the
                                middle of the shift.

     worked(a,b)    ms between a and b that fall inside the window and outside breaks.
     W              worked hours for the whole shift = worked(start, end)
     t              now clamped into [start, end]
     w              worked hours so far = worked(start, t);  left = W - w
     fraction       w / W
     day target     T  = W x sum(needRate of every configured machine)
     pace car       PC = fraction x T                 (per machine: fraction x W x rate)
     lbs ran        L  = sum of coil weights
     deficit/surplus  D = L - PC;  D% = D / PC x 100   (blank while PC = 0)
     current pace   P  = L / w   (only once w >= 10 min; blank before that)
     projected      L + P x left                       (P must exist)

     hit target at  if L >= T: already hit. Else if P > 0 and shift not over:
                    the clock time after (T - L) / P more WORKED hours from now
                    (breaks skipped; after the shift end time runs straight on).
                    early/late = hit time - end (negative = early).

     DOWNTIME (by weight)

                    one machine or "all". Per machine: its own + "all" intervals are merged
                    (overlaps count once) and only WORKED time inside them counts, so break and
                    off-shift time is never deducted twice.
                      downTotal_m = worked ms in the merged intervals
                      downSoFar_m = the same, only up to t
                      target_m    = W x rate_m - rate_m x downTotal_m
                      paceCar_m   = w x rate_m - rate_m x downSoFar_m   (flat while the machine is down)

    });
    if (machines.length) st.machines = machines;
    st.coils = coils;
    st.setupDone = false;                          // show the wizard pre-filled so it gets confirmed
    return st;
  }

  function parseKey(k) {
    try { var raw = window.localStorage.getItem(k); return raw ? sanitize(JSON.parse(raw)) : null; } catch (e) { return null; }
  }
  function lastActivity(st) {
    var t = Date.parse(st.shift.updatedAt) || 0;
    st.coils.forEach(function (c) { t = Math.max(t, Date.parse(c.loggedAt) || 0); });
    st.downtime.forEach(function (d) { t = Math.max(t, Date.parse(d.endAt || d.startAt) || 0); });
    return t;
  }
  function unionById(a, b) {
    var seen = {}, out = a.slice();
    a.forEach(function (x) { seen[x.id] = 1; });
    b.forEach(function (x) { if (!seen[x.id]) out.push(x); });
    return out;
  }
  // One time per browser: bring in v4 data ("drawRateV4" is only read, never changed).
  //   no v5 yet            -> v4 becomes v5
  //   same shift in both   -> coils + downtime merged by id (v5 wins on the same id)
  //   different shifts     -> the one with the most recent activity is kept as v5
  function importV4(v5) {
    var done = false;
    try { done = window.localStorage.getItem(MERGED_FLAG) === "1"; } catch (e) {}
    if (done) return v5;
    var v4 = parseKey(V4_KEY), out = v5;
    if (v4) {
      if (!v5) out = v4;
      else if (v4.shift.id === v5.shift.id) {
        var ids = {}; v5.machines.forEach(function (m) { ids[m.id] = 1; });
        var ok = function (x) { return ids[x.machineId] || x.machineId === "all"; };
        v5.coils = unionById(v5.coils, v4.coils.filter(ok));
        v5.downtime = unionById(v5.downtime, v4.downtime.filter(ok));
        out = v5;
      } else if (lastActivity(v4) > lastActivity(v5)) out = v4;
    }
    try {
      if (out && out !== v5) { out.schema = SCHEMA; window.localStorage.setItem(KEY, JSON.stringify(out)); }
      else if (out && v4) window.localStorage.setItem(KEY, JSON.stringify(out));
      window.localStorage.setItem(MERGED_FLAG, "1");
    } catch (e) {}
    return out;
  }
  function load() {
    var s = importV4(parseKey(KEY));
    if (s) return s;
    try {
      var old = window.localStorage.getItem(OLD_KEY);
      if (old) { var m = migrateOld(old); if (m) { m.migrated = true; return m; } }
    } catch (e2) { /* fall through */ }
    return defaultState();
  }
  function save() {
    try {
      state.shift.updatedAt = iso(Date.now());
      var out = { schema: SCHEMA, setupDone: state.setupDone, shift: state.shift, machines: state.machines, coils: state.coils, downtime: state.downtime, settings: state.settings };
      window.localStorage.setItem(KEY, JSON.stringify(out));
    } catch (e) { /* storage blocked or full: keep working in memory */ }
  }

  var state = load();
  function machineById(id) { for (var i = 0; i < state.machines.length; i++) if (state.machines[i].id === id) return state.machines[i]; return null; }
  function coilsOf(id) {
    return state.coils.filter(function (c) { return c.machineId === id; })
      .sort(function (a, b) { return Date.parse(a.loggedAt) - Date.parse(b.loggedAt); });
  }

  /* =========================== WIZARD =========================== */
  var STEPS = ["schedule", "breaks", "count", "machines", "operator", "review"];
  var wz = null;   // { step, draft, editing }

  function draftFromState() {
    var s = state.shift;
    return {
      date: s.date || todayStr(), start: s.start, end: s.end, operator: s.operator,
      breakMode: s.breakMode, breakTotalMin: s.breakTotalMin,
      breaks: s.breaks.map(function (b) { return { id: b.id, start: b.start, minutes: b.minutes }; }),
      machines: state.machines.map(function (m) { return { id: m.id, name: m.name, needRate: m.needRate }; })
    };
  }
  function draftShift(d) {
    return { date: d.date, start: d.start, end: d.end, breakMode: d.breakMode, breakTotalMin: d.breakTotalMin, breaks: d.breaks };
  }
  function draftNumbers(d) {
    var sh = draftShift(d), win = Calc.shiftWindow(sh);
    if (!win) return null;
    var br = Calc.breakIntervals(sh, win);
    var W = Calc.worked(win, br, win.start, win.end);
    var rate = 0; d.machines.forEach(function (m) { rate += num(m.needRate) > 0 ? num(m.needRate) : 0; });
    return { win: win, gross: win.end - win.start, worked: W, breakMs: win.end - win.start - W, target: W / Calc.HOUR * rate };
  }

  function openWizard(editing) {
    wz = { step: 0, draft: draftFromState(), editing: editing };
    $("dash").hidden = true; $("wizard").hidden = false;
    renderWizard();
  }
  function closeWizard() { wz = null; $("wizard").hidden = true; $("dash").hidden = false; buildDashboard(); tick(); }

  function field(labelText, input, extraCls) {
    var f = el("div", "field" + (extraCls ? " " + extraCls : ""));
    var l = el("label", "lbl", labelText);
    if (input.id) l.setAttribute("for", input.id);
    f.appendChild(l); f.appendChild(input);
    return f;
  }
  function input(type, id, value, attrs) {
    var i = el("input", "in");
    i.type = type; if (id) i.id = id;
    if (value != null) i.value = value;
    if (attrs) for (var k in attrs) if (attrs.hasOwnProperty(k)) i.setAttribute(k, attrs[k]);
    return i;
  }

  function renderWizard() {
    var step = STEPS[wz.step], d = wz.draft, body = $("wz-body");
    body.textContent = "";
    setText($("wz-error"), "");
    setText($("wz-step"), "STEP " + (wz.step + 1) + " OF " + STEPS.length);

    $("wz-back").disabled = wz.step === 0;
    setText($("wz-next"), step === "review" ? (wz.editing ? "SAVE SETUP" : "SUBMIT") : "NEXT");
    $("wz-cancel").hidden = !wz.editing;
    var title = "", help = "";

    if (step === "schedule") {
      title = "What is your schedule?";
      help = "Shift start and end. If the end is earlier than the start, it ends the next morning.";
      if (state.migrated) help = "Brought over your punches, need rates and coils from the previous tracker. Check them and submit. " + help;
      var row = el("div", "row2");
      var si = input("time", "wz-start", d.start), ei = input("time", "wz-end", d.end);
      row.appendChild(field("Shift start", si)); row.appendChild(field("Shift end", ei));
      body.appendChild(row);
      body.appendChild(field("Shift date", input("date", "wz-date", d.date)));
      var note = el("p", "calc-note"); note.id = "wz-sched-note"; body.appendChild(note);
      var upd = function () {
        d.start = $("wz-start").value; d.end = $("wz-end").value; d.date = $("wz-date").value;
        var w = Calc.shiftWindow(draftShift(d));
        setText(note, w ? fmtDur(w.end - w.start) + " shift" + (w.overnight ? " · ends next morning" : "") : "");
      };
      ["wz-start", "wz-end", "wz-date"].forEach(function (id) { $(id).addEventListener("input", upd); $(id).addEventListener("change", upd); });
      upd();
    }

    if (step === "breaks") {
      title = "What are your breaks?";
      help = "Breaks are not counted as run time, so the pace car pauses during them.";
      var seg = el("div", "seg");
      var bTot = el("button", "btn" + (d.breakMode !== "list" ? " on" : ""), "TOTAL MINUTES");
      var bList = el("button", "btn" + (d.breakMode === "list" ? " on" : ""), "LIST OF BREAKS");
      bTot.type = bList.type = "button"; bTot.id = "wz-mode-total"; bList.id = "wz-mode-list";
      bTot.addEventListener("click", function () { d.breakMode = "total"; renderWizard(); });
      bList.addEventListener("click", function () { d.breakMode = "list"; if (!d.breaks.length) d.breaks.push({ id: uid("b"), start: "", minutes: 30 }); renderWizard(); });
      seg.appendChild(bTot); seg.appendChild(bList); body.appendChild(seg);
      var bnote = el("p", "calc-note"); bnote.id = "wz-break-note";
      var updB = function () {
        var n = draftNumbers(d);
        setText(bnote, n && n.worked > 0 ? fmtDur(n.worked) + " worked · " + fmtDur(n.breakMs) + " of breaks" : "");
      };
      if (d.breakMode !== "list") {
        var ti = input("number", "wz-break-total", d.breakTotalMin, { inputmode: "numeric", min: "0", step: "5" });
        ti.addEventListener("input", function () { d.breakTotalMin = num(ti.value); updB(); });
        body.appendChild(field("Total break minutes", ti));
        body.appendChild(el("p", "sub", "Counted as one break in the middle of the shift. Use a list for exact times."));
      } else {
        d.breaks.forEach(function (b, i) {
          var r = el("div", "break-row");
          var bs = input("time", "wz-bstart-" + i, b.start), bm = input("number", "wz-bmin-" + i, b.minutes, { inputmode: "numeric", min: "1", step: "5" });
          bs.addEventListener("input", function () { b.start = bs.value; updB(); });
          bs.addEventListener("change", function () { b.start = bs.value; updB(); });
          bm.addEventListener("input", function () { b.minutes = num(bm.value); updB(); });
          var x = el("button", "btn warn", "X"); x.type = "button"; x.setAttribute("aria-label", "Remove break " + (i + 1));
          x.addEventListener("click", function () { d.breaks.splice(i, 1); renderWizard(); });
          r.appendChild(field("Break " + (i + 1) + " start", bs, ""));
          r.appendChild(field("Minutes", bm, ""));
          r.appendChild(x);
          body.appendChild(r);
        });
        var add = el("button", "btn small", "+ ADD BREAK"); add.type = "button"; add.id = "wz-add-break";
        add.addEventListener("click", function () { d.breaks.push({ id: uid("b"), start: "", minutes: 15 }); renderWizard(); });
        if (d.breaks.length < 12) body.appendChild(add);
      }
      body.appendChild(bnote); updB();
    }

    if (step === "count") {
      title = "How many machines are you running?";
      help = "Every machine you set up counts toward the day target.";
      var g = el("div", "count-grid");
      for (var n = 1; n <= MAX_MACHINES; n++) {
        (function (n) {
          var b = el("button", "btn" + (d.machines.length === n ? " on" : ""), String(n));
          b.type = "button"; b.id = "wz-count-" + n;
          b.addEventListener("click", function () { setCount(d, n); renderWizard(); });
          g.appendChild(b);
        })(n);
      }
      body.appendChild(g);
    }

    if (step === "machines") {
      title = d.machines.length > 1 ? "Need rate at each machine" : "Need rate for your machine";
      help = "Name each machine and enter the lb/hr you need from it.";
      d.machines.forEach(function (m, i) {
        var r = el("div", "mach-row");
        var ni = input("text", "wz-mname-" + i, m.name, { autocomplete: "off", maxlength: "40" });
        var ri = input("number", "wz-mrate-" + i, m.needRate, { inputmode: "decimal", min: "1", step: "10" });
        ni.addEventListener("input", function () { m.name = ni.value; });
        ri.addEventListener("input", function () { m.needRate = num(ri.value); });
        var row = el("div", "row2");
        row.appendChild(field("Machine " + (i + 1) + " name", ni));
        row.appendChild(field("Need rate lb/hr", ri));
        r.appendChild(row);
        body.appendChild(r);
      });
    }

    if (step === "operator") {
      title = "Anything else? (optional)";
      help = "Operator name or ID is saved with the shift for later records. Leave blank to skip.";
      var oi = input("text", "wz-operator", d.operator, { autocomplete: "off", maxlength: "60", placeholder: "Name or ID" });
      oi.addEventListener("input", function () { d.operator = oi.value; });
      body.appendChild(field("Operator name / ID", oi));
    }

    if (step === "review") {
      title = "Check and submit";
      help = "This sets your day target. You can change it later with EDIT SETUP.";
      var nums = draftNumbers(d);
      var tbl = el("table", "review"), tb = el("tbody");
      var add2 = function (k, v) { var tr = el("tr"); tr.appendChild(el("td", null, k)); tr.appendChild(el("td", null, v)); tb.appendChild(tr); };
      add2("Date", d.date);
      add2("Schedule", fmtHHMM(d.start) + " – " + fmtHHMM(d.end) + (nums && nums.win.overnight ? " (next day)" : ""));
      add2("Breaks", d.breakMode === "list"
        ? d.breaks.map(function (b) { return fmtHHMM(b.start) + " " + b.minutes + "m"; }).join(", ") || "none"
        : (d.breakTotalMin || 0) + " min total");
      add2("Worked time", nums ? fmtDur(nums.worked) : "—");
      d.machines.forEach(function (m) { add2(m.name || "Machine", fmtInt(m.needRate) + " lb/hr"); });
      if (d.operator) add2("Operator", d.operator);
      add2("Day target", nums ? fmtInt(nums.target) + " lb" : "—");
      tbl.appendChild(tb); body.appendChild(tbl);
    }

    setText($("wz-title"), title); setText($("wz-help"), help);
    var first = body.querySelector("input");
    if (first && !("ontouchstart" in window)) { try { first.focus(); } catch (e) {} }
  }

  function setCount(d, n) {
    while (d.machines.length < n) d.machines.push({ id: null, name: "Machine " + (d.machines.length + 1), needRate: DEFAULT_RATE });
    if (d.machines.length > n) d.machines.length = n;
  }

  function validateStep() {
    var step = STEPS[wz.step], d = wz.draft;
    if (step === "schedule") {
      if (!Calc.parseDate(d.date)) return "Enter the shift date.";
      if (!okClock(d.start)) return "Enter the shift start time.";
      if (!okClock(d.end)) return "Enter the shift end time.";
      if (d.start === d.end) return "Start and end can't be the same time.";
    }
    if (step === "breaks") {
      var nums = draftNumbers(d);
      if (d.breakMode === "list") {
        for (var i = 0; i < d.breaks.length; i++) {
          var b = d.breaks[i];
          if (!okClock(b.start)) return "Enter a start time for break " + (i + 1) + ", or remove it.";
          if (!(num(b.minutes) > 0)) return "Enter the minutes for break " + (i + 1) + ".";
          var one = draftShift(d); one.breaks = [b];
          var w = Calc.shiftWindow(one), iv = Calc.breakIntervals(one, w);
          var inside = iv.length ? iv[0][1] - iv[0][0] : 0;
          if (inside < b.minutes * 60000 - 1) return "Break " + (i + 1) + " (" + fmtHHMM(b.start) + ") falls outside the shift.";
        }
      } else if (!(num(d.breakTotalMin) >= 0)) return "Enter total break minutes (0 if none).";
      if (!nums || nums.worked <= 0) return "Breaks take up the whole shift. Check the minutes.";
    }
    if (step === "machines") {
      for (var j = 0; j < d.machines.length; j++) {
        var m = d.machines[j];
        if (!(num(m.needRate) > 0 && num(m.needRate) < 1e6)) return "Enter a need rate (lb/hr) for " + (m.name || "machine " + (j + 1)) + ".";
      }
    }
    return "";
  }

  function wizardNext() {
    var err = validateStep();
    if (err) { setText($("wz-error"), err); return; }
    if (wz.step < STEPS.length - 1) { wz.step++; renderWizard(); window.scrollTo(0, 0); return; }
    submitWizard();
  }

  function submitWizard() {
    var d = wz.draft;
    // machines being removed that still have coils
    var keepIds = {};
    d.machines.forEach(function (m) { if (m.id) keepIds[m.id] = true; });
    var dropped = state.machines.filter(function (m) { return !keepIds[m.id] && coilsOf(m.id).length; });
    if (dropped.length && !window.confirm("Removing " + dropped.map(function (m) { return m.name; }).join(", ") +
      " also deletes its logged coils. Continue?")) return;
    var old = {};
    state.machines.forEach(function (m) { old[m.id] = m; });
    state.machines = d.machines.map(function (m, i) {
      var prev = m.id && old[m.id];
      var name = (m.name || "").replace(/^\s+|\s+$/g, "") || "Machine " + (i + 1);
      return { id: prev ? prev.id : uid("m"), slot: i + 1, name: name.slice(0, 40), needRate: num(m.needRate),
        timerStartedAt: prev ? prev.timerStartedAt : null, timerAccumMs: prev ? prev.timerAccumMs : 0 };
    });
    var ids = {}; state.machines.forEach(function (m) { ids[m.id] = true; });
    state.coils = state.coils.filter(function (c) { return ids[c.machineId]; });
    state.downtime = state.downtime.filter(function (x) { return ids[x.machineId] || x.machineId === "all"; });
    var s = state.shift;
    s.date = d.date; s.start = d.start; s.end = d.end; s.operator = str(d.operator, 60).replace(/^\s+|\s+$/g, "");
    s.breakMode = d.breakMode === "list" ? "list" : "total";
    s.breakTotalMin = num(d.breakTotalMin) >= 0 ? num(d.breakTotalMin) : 0;
    s.breaks = s.breakMode === "list" ? d.breaks.map(function (b) { return { id: b.id || uid("b"), start: b.start, minutes: num(b.minutes) }; }) : [];
    state.setupDone = true;
    delete state.migrated;
    save();
    closeWizard();
  }

  $("wz-next").addEventListener("click", wizardNext);
  $("wz-back").addEventListener("click", function () { if (wz && wz.step > 0) { wz.step--; renderWizard(); } });
  $("wz-cancel").addEventListener("click", function () { closeWizard(); });
  $("wz-body").addEventListener("input", function () { setText($("wz-error"), ""); });
  $("wz-body").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.tagName === "INPUT") { e.preventDefault(); wizardNext(); }
  });

  /* ========================= DASHBOARD ========================= */
  var cards = {};      // machineId -> { name, rate, ran, pc, dl, input, last }
  var advOpen = false, editingCoil = null, lastLogged = {};

  function buildDashboard() {
    var box = $("d-machines");
    box.textContent = "";
    cards = {};
    state.machines.forEach(function (m, i) {
      var c = el("div", "mc"); c.id = "mc-" + i;
      var head = el("div", "mc-head");
      var nm = el("span", "mc-name", m.name), rt = el("span", "mc-rate", "need " + fmtInt(m.needRate) + " lb/hr");
      head.appendChild(nm); head.appendChild(rt); c.appendChild(head);
      var stats = el("div", "mc-stats");
      var mk = function (label) { var dv = el("div"); dv.appendChild(el("span", "lbl", label)); var b = el("b", null, "—"); dv.appendChild(b); stats.appendChild(dv); return b; };
      var ran = mk("Ran"), pc = mk("Pace car"), dl = mk("+/-");
      c.appendChild(stats);
      var wl = el("label", "wt-lbl", "COIL WEIGHT (LBS)"); wl.setAttribute("for", "log-" + i); c.appendChild(wl);
      var log = el("div", "mc-log");
      var inp = input("text", "log-" + i, "", { inputmode: "decimal", autocomplete: "off", enterkeyhint: "done", placeholder: "Weight (lbs)", "aria-label": "Coil weight in lbs for " + m.name });
      var btn = el("button", "btn solid", "LOG COIL"); btn.type = "button"; btn.id = "logbtn-" + i;
      var last = el("div", "mc-last sub");
      btn.addEventListener("click", function () { logCoil(m.id, inp, last); });
      inp.addEventListener("input", function () { if (last.className.indexOf("red") >= 0) { setCls(last, "mc-last sub"); lastLogged[m.id] = true; tick(); } });
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); logCoil(m.id, inp, last); } });
      log.appendChild(inp); log.appendChild(btn); c.appendChild(log); c.appendChild(last);
      var drow = el("div", "mc-down"), dtx = el("span", "mc-down-txt", ""), dbt = el("button", "btn small warn", "START DOWNTIME");
      dbt.type = "button"; dbt.id = "down-" + i;
      dbt.addEventListener("click", function () { toggleMachineDown(m.id); });
      drow.appendChild(dtx); drow.appendChild(dbt); c.appendChild(drow);
      box.appendChild(c);
      cards[m.id] = { ran: ran, pc: pc, dl: dl, last: last, dtx: dtx, dbt: dbt };
    });
    var s = state.shift;
    setText($("d-shift"), s.date + " · " + fmtHHMM(s.start) + " – " + fmtHHMM(s.end) + (s.operator ? " · " + s.operator : ""));
    if (advOpen) renderAdvanced();
    if (dtOpen) renderDowntime();
    if (rcOpen) renderRecent();
  }

  // A coil WEIGHT typed by an operator. Asks first (in-page, [Yes, log it] / [Fix it]) when it
  // looks like a coil ID (letters, dashes, a leading-zero tag like 004512), or is over
  // settings.confirmOverLb or under settings.confirmUnderLb. onOk(weight) runs only once it's OK.
  function fmtLb(w) { return w % 1 ? fmtInt(Math.floor(w)) + "." + String(Math.round(w * 10) % 10) : fmtInt(w); }
  function checkCoilWeight(raw, inp, showErr, onOk) {
    var t = String(raw == null ? "" : raw).trim(), set = state.settings || defaultSettings();
    if (!t) { showErr("Enter the coil weight in lbs."); return; }
    var clean = t.replace(/,/g, "").replace(/\s*lbs?\.?$/i, "");
    var plain = /^(\d+\.?\d*|\.\d+)$/.test(clean);
    var w = parseFloat(plain ? clean : clean.replace(/[^0-9.]/g, ""));
    if (!(w > 0) || w >= 1e7) { showErr(plain ? "Enter a coil weight greater than 0." : "That looks like a coil ID, not a weight. Enter the coil weight in lbs."); return; }
    w = Math.round(w * 10) / 10;
    var q = null;
    if (!plain || /^0\d{3,}/.test(clean)) q = "That looks like a coil ID, not a weight. Log " + fmtLb(w) + " lb anyway?";
    else if (w > set.confirmOverLb) q = fmtLb(w) + " lb is over " + fmtInt(set.confirmOverLb) + " lb. Is that the coil weight (not the coil ID)?";
    else if (w < set.confirmUnderLb) q = fmtLb(w) + " lb is under " + fmtInt(set.confirmUnderLb) + " lb. Is that right?";
    if (!q) { onOk(w); return; }
    askConfirm(q, "Yes, log it", "Fix it", function () { onOk(w); }, function () {
      showErr("Not logged. Fix the weight and log it again.");
      if (inp) { try { inp.focus(); inp.select(); } catch (e) {} }
    });
  }

  // in-page confirm (big buttons; window.confirm can't label them)
  var askOpen = null;
  function askConfirm(msg, yesText, noText, onYes, onNo) {
    var box = $("ask"); if (askOpen) closeAsk(false);
    setText($("ask-msg"), msg); setText($("ask-yes"), yesText); setText($("ask-no"), noText);
    askOpen = { yes: onYes, no: onNo, back: document.activeElement };
    box.hidden = false;
    try { $("ask-yes").focus(); } catch (e) {}
  }
  function closeAsk(ok) {
    var a = askOpen; askOpen = null; $("ask").hidden = true;
    if (!a) return;
    if (ok) { if (a.yes) a.yes(); } else if (a.no) a.no();
  }
  $("ask-yes").addEventListener("click", function () { closeAsk(true); });
  $("ask-no").addEventListener("click", function () { closeAsk(false); });
  document.addEventListener("keydown", function (e) { if (askOpen && e.key === "Escape") { e.preventDefault(); closeAsk(false); } });

  function logCoil(machineId, inp, lastEl) {
    checkCoilWeight(inp.value, inp, function (msg) { setText(lastEl, msg); setCls(lastEl, "mc-last red"); },
      function (w) { addCoil(machineId, w); inp.value = ""; try { inp.blur(); } catch (e) {} });

  function colorFor(pct) { return pct == null ? "white" : pct >= 0 ? "green" : pct > -5 ? "amber" : "red"; }

  function tick() {
    if (!state.setupDone || !$("wizard").hidden) return;
    var now = Date.now(), r = Calc.compute(state, now);
    setText($("d-clock"), fmtClock(now, true));
    var ph = $("d-phase"), phase = "", phCls = "phase";
    if (r.phase === "invalid") { phase = "SETUP INCOMPLETE · tap EDIT SETUP"; phCls = "phase amber"; }
    else if (r.phase === "before") { phase = "SHIFT STARTS " + fmtClockDay(r.start, now) + " · in " + fmtDur(r.start - now); phCls = "phase amber"; }
    else if (r.phase === "after") { phase = "SHIFT OVER · final numbers"; phCls = "phase amber"; }
    else if (r.onBreakUntil) { phase = "ON BREAK until " + fmtClock(r.onBreakUntil) + " · pace car paused"; phCls = "phase amber"; }
    else phase = "ON SHIFT · " + fmtDur(r.workedSoFarMs) + " worked · " + fmtDur(r.workedLeftMs) + " left";
    setText(ph, phase); setCls(ph, phCls);

    setText($("d-ran"), fmtInt(r.lbsRan));
    setText($("d-pc"), r.paceCar == null ? "—" : fmtInt(r.paceCar));
    var T = r.target;
    $("d-fill").style.width = T ? Math.min(100, r.lbsRan / T * 100) + "%" : "0";
    $("d-mark").style.left = T ? Math.min(100, r.paceCar / T * 100) + "%" : "0";
    setText($("d-of-target"), T ? fmtW(r.lbsRan / T * 100) + "% of day target" : "");
    setText($("d-target"), T ? "TARGET " + fmtInt(T) + " lb" : "");

    // deficit / surplus
    var col = colorFor(r.deltaPct);
    if (r.paceCar == null || r.phase === "before" || r.paceCar <= 0) {
      setText($("d-delta-lbl"), "Deficit / surplus");
      setText($("d-delta-lb"), "—"); setText($("d-delta-pct"), "");
      setCls($("d-delta"), "delta white");
      setText($("d-delta-note"), r.phase === "before" ? "Starts when the shift starts." : "");
    } else {
      setText($("d-delta-lbl"), r.delta >= 0 ? "Surplus" : "Deficit");
      setText($("d-delta-lb"), fmtSigned(r.delta) + " lb");
      setText($("d-delta-pct"), fmtPct(r.deltaPct));
      setCls($("d-delta"), "delta glow " + col);
      setText($("d-delta-note"), (r.delta >= 0 ? "ahead of" : "behind") + " the pace car");
    }

    // projection
    var note = "";
    if (r.phase === "invalid") {
      ["p-pace", "p-proj", "p-vs", "p-hit", "p-catch"].forEach(function (id) { setText($(id), "—"); });
    } else {
      var paceOk = r.pace != null && r.pace > 0;
      setText($("p-pace"), paceOk ? fmtInt(r.pace) + " lb/hr" : "—");
      setText($("p-proj"), paceOk || r.phase === "after" ? fmtInt(r.projected == null ? r.lbsRan : r.projected) + " lb" : "—");
      var vsTxt = "—", vsCls = "";
      if (paceOk || r.phase === "after") {
        var pv = r.projected == null ? r.lbsRan : r.projected, pd = pv - T;
        vsTxt = fmtSigned(pd) + " lb · " + fmtPct(pd / T * 100);
        vsCls = colorFor(pd / T * 100);
      }
      setText($("p-vs"), vsTxt); setCls($("p-vs"), vsCls);
      var hit = "—", hitCls = "";
      if (r.targetHit) { hit = "TARGET HIT"; hitCls = "green"; }
      else if (r.hitAt != null) {
        var early = r.hitVsEndMs <= 0;
        hit = fmtClockDay(r.hitAt, now) + " · " + fmtDur(Math.abs(r.hitVsEndMs)) + (early ? " early" : " late");
        hitCls = early ? "green" : "red";
      } else if (r.phase === "after") { hit = "Missed by " + fmtInt(T - r.lbsRan) + " lb"; hitCls = "red"; }
      setText($("p-hit"), hit); setCls($("p-hit"), hitCls);
      var cu = "—", cuCls = "";
      if (r.targetHit) { cu = "0 · target hit"; cuCls = "green"; }
      else if (r.catchUp != null && r.phase !== "after") { cu = fmtInt(r.catchUp) + " lb/hr"; cuCls = r.catchUp <= r.rateSum ? "" : "red"; }
      setText($("p-catch"), cu); setCls($("p-catch"), cuCls);

      if (r.phase === "before") note = "Projection starts once you have 10 minutes on the clock.";
      else if (r.phase === "after") note = r.targetHit ? "Shift over. Target made." : "Shift over.";
      else if (r.pace == null) note = "Projection starts after 10 minutes worked (" + fmtDur(r.paceWaitMs) + " to go).";
      else if (r.pace === 0) note = "No lbs logged yet. Log a coil to see a projection.";
      else if (r.onBreakUntil) note = "On break: the clock and pace car are paused.";
    }
    setText($("p-note"), note);

    // machines
    r.machines.forEach(function (mr) {
      var c = cards[mr.id]; if (!c) return;
      setText(c.ran, fmtInt(mr.lbs));
      setText(c.pc, mr.paceCar == null ? "—" : fmtInt(mr.paceCar));
      setText(c.dl, mr.deltaPct == null || r.phase === "before" ? "—" : fmtPct(mr.deltaPct));
      setCls(c.dl, mr.deltaPct == null || r.phase === "before" ? "" : colorFor(mr.deltaPct));
      var lc = null, list = coilsOf(mr.id);
      if (list.length) lc = list[list.length - 1];
      var t = lc ? "Last coil " + fmtW(lc.weight) + " lb at " + fmtClock(Date.parse(lc.loggedAt)) + " · " + list.length + " coil" + (list.length === 1 ? "" : "s") : "No coils yet";
      if (c.last.className.indexOf("red") < 0 || lastLogged[mr.id]) { setText(c.last, t); setCls(c.last, "mc-last sub"); }
      lastLogged[mr.id] = null;
    });

    updateDowntimeUI(r, now);

    // advanced timers
    state.machines.forEach(function (m, i) {
      var te = $("timer-" + i);
      if (te) setText(te, fmtTimer(m, now));
    });
  }

  function fmtTimer(m, now) {
    var ms = m.timerAccumMs + (m.timerStartedAt ? Math.max(0, now - Date.parse(m.timerStartedAt)) : 0);
    var s = Math.floor(ms / 1000);
    return Math.floor(s / 3600) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60);
  }

  /* ---------- export ---------- */
  function fileBase() { return "draw-rate_" + state.shift.date + "_" + state.shift.id; }
  function summary() {
    var r = Calc.compute(state, Date.now());
    return { computedAt: iso(Date.now()), phase: r.phase, workedHours: r.workedTotalMs != null ? r.workedTotalMs / 3600000 : null,
      dayTargetLb: r.target != null ? r.target : null, lbsRan: r.lbsRan, paceCarLb: r.paceCar != null ? r.paceCar : null,
      deltaLb: r.delta != null ? r.delta : null, deltaPct: r.deltaPct != null ? r.deltaPct : null,
      currentPaceLbHr: r.pace != null ? r.pace : null, projectedLb: r.projected != null ? r.projected : null,
      hitTargetAt: r.hitAt != null ? iso(r.hitAt) : null, catchUpLbHr: r.catchUp != null ? r.catchUp : null,
      grossTargetLb: r.grossTarget != null ? r.grossTarget : null, downtimeMachineMin: r.downMs / 60000, downtimeLbOffTarget: r.downLb, downtimeLbOffPaceCar: r.downSoFarLb };
  }
  function exportJSON() {
    return JSON.stringify({ schema: SCHEMA, exportedAt: iso(Date.now()), shift: state.shift, machines: state.machines,
      coils: state.coils, downtime: state.downtime, settings: state.settings, summary: summary() }, null, 2);
  }
  function csvCell(v) {
    if (v == null) return "";
    var s = String(v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function exportCSV() {
    var s = state.shift, r = Calc.compute(state, Date.now()), imp = r.downEntries || {};
    var breaks = s.breakMode === "list" ? s.breaks.map(function (b) { return b.start + "/" + b.minutes; }).join(" ") : s.breakTotalMin + " total";
    var head = ["record_type", "shift_id", "shift_date", "operator", "shift_start", "shift_end", "breaks", "machine_id", "machine_slot",
      "machine_name", "need_rate_lb_hr", "record_id", "logged_at", "weight_lb", "coil_no", "heat_no", "size", "notes", "downtime_min", "downtime_reason",
      "downtime_start", "downtime_end", "downtime_lb_deducted"];
    var rows = [head];
    var mrow = function (type, m, rec) {
      return [type, s.id, s.date, s.operator, s.start, s.end, breaks, m.id, m.slot, m.name, m.needRate].concat(rec);
    };
    var drow = function (m, d) {
      var x = imp[d.id];
      return mrow("downtime", m, [d.id, d.loggedAt, "", "", "", "", "", d.minutes == null ? "" : Math.round(d.minutes * 10) / 10, d.reason,
        d.startAt, d.endAt || "running", x ? Math.round(x.lb) : ""]);
    };
    var rateSum = 0;
    state.machines.forEach(function (m) {
      rateSum += m.needRate;
      rows.push(mrow("machine", m, ["", "", "", "", "", "", "", "", "", "", "", ""]));
      coilsOf(m.id).forEach(function (c) {
        rows.push(mrow("coil", m, [c.id, c.loggedAt, c.weight, c.coilNo, c.heatNo, c.size, c.notes, c.downtimeMin, c.downtimeReason, "", "", ""]));
      });
      state.downtime.filter(function (d) { return d.machineId === m.id; }).forEach(function (d) { rows.push(drow(m, d)); });
    });
    var allM = { id: "all", slot: "", name: "All machines", needRate: rateSum };
    state.downtime.filter(function (d) { return d.machineId === "all"; }).forEach(function (d) { rows.push(drow(allM, d)); });
    return rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n") + "\r\n";
  }
  function download(name, text, type) {
    try {
      var blob = new Blob([text], { type: type + ";charset=utf-8" });
      if (window.navigator && window.navigator.msSaveOrOpenBlob) { window.navigator.msSaveOrOpenBlob(blob, name); return; }
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = name; a.style.display = "none";
      document.body.appendChild(a); a.click();
      setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
      setText($("ex-msg"), "Saved " + name + " to Downloads.");
    } catch (e) { setText($("ex-msg"), "Download blocked here. Use COPY instead."); }
  }
  function copyText(text, msgEl) {
    var done = function () { setText(msgEl, "Copied to clipboard."); };
    var fallback = function () {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "-1000px";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      setText(msgEl, ok ? "Copied to clipboard." : "Copy blocked here. Use DOWNLOAD instead.");
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  /* ========================= DOWNTIME (by weight) ========================= */
  var dtOpen = false, dtTarget = "all";
  var MINUS = "\u2212";
  function dtName(id) { if (id === "all") return "All machines"; var m = machineById(id); return m ? m.name : "?"; }
  function runningFor(id) {
    for (var i = 0; i < state.downtime.length; i++) { var d = state.downtime[i]; if (d.machineId === id && !d.endAt) return d; }
    return null;
  }
  function startDown(id, reason) {
    if (runningFor(id)) return;
    var n = iso(Date.now());
    state.downtime.push({ id: uid("d"), machineId: id, loggedAt: n, startAt: n, endAt: null, minutes: null, reason: str(reason || "", 200) });
    save(); tick(); if (dtOpen) renderDowntime();
  }
  function endDown(d) {
    var a = Date.parse(d.startAt), e = Math.max(Date.now(), a + 1000);

    save(); tick(); if (dtOpen) renderDowntime();
  }
  function toggleMachineDown(id) {
    var own = runningFor(id), all = runningFor("all");
    if (own) endDown(own); else if (all) endDown(all); else startDown(id, "");
  }
  function lbOff(lb) { return MINUS + fmtInt(lb) + " lb"; }
  function entryText(d, r, now) {
    var a = Date.parse(d.startAt), b = d.endAt ? Date.parse(d.endAt) : now, x = (r.downEntries || {})[d.id] || { ms: 0, lb: 0 };
    var t = (d.endAt ? "" : "DOWN NOW · ") + fmtClock(a) + "–" + (d.endAt ? fmtClock(b) : "now") + " · " + dtName(d.machineId) + " · " + fmtDur(b - a) + " · " + lbOff(x.lb);
    if (r.phase !== "invalid" && b - a - x.ms > 30000) t += " (" + fmtDur(b - a - x.ms) + " on break / off shift not counted)";
    if (d.reason) t += " · " + d.reason;
    return t;
  }
  function sortedDowntime() { return state.downtime.slice().sort(function (x, y) { return Date.parse(y.startAt) - Date.parse(x.startAt); }); }

  function renderDowntime() {
    var box = $("dtp"), now = Date.now(), r = Calc.compute(state, now);
    box.textContent = "";
    if (dtTarget !== "all" && !machineById(dtTarget)) dtTarget = "all";
    box.appendChild(el("p", "sub", "Downtime comes off the day target and the pace car at the machine's need rate (All machines = every need rate added up). Time that falls on a break is never taken twice."));
    var sel = el("select", "in"); sel.id = "dt-target";
    [["all", "All machines"]].concat(state.machines.map(function (m) { return [m.id, m.name + " · " + fmtInt(m.needRate) + " lb/hr"]; })).forEach(function (o) {
      var op = el("option", null, o[1]); op.value = o[0]; sel.appendChild(op);
    });
    sel.value = dtTarget;
    sel.addEventListener("change", function () { dtTarget = sel.value; renderDowntime(); });
    box.appendChild(field("Machine", sel));
    var reason = input("text", "dt-reason", "", { maxlength: "200", placeholder: "Reason (optional)", autocomplete: "off" });
    box.appendChild(field("Reason", reason));
    var runNow = runningFor(dtTarget);
    var sb = el("button", "btn warn full", runNow ? dtName(dtTarget).toUpperCase() + " IS DOWN · END IT BELOW" : "START DOWNTIME NOW");
    sb.type = "button"; sb.id = "dt-start"; sb.disabled = !!runNow;
    sb.addEventListener("click", function () { startDown(dtTarget, reason.value); });
    box.appendChild(sb);

    box.appendChild(el("h3", null, "Log past downtime"));
    var g = el("div", "dt-past");
    var mi = input("number", "dt-min", "", { inputmode: "numeric", min: "1", step: "1", placeholder: "Min" });
    var ti = input("time", "dt-from", "");
    var add = el("button", "btn small", "ADD"); add.type = "button"; add.id = "dt-add";
    g.appendChild(field("Minutes", mi)); g.appendChild(field("Started at (blank = just ended)", ti)); g.appendChild(add);
    box.appendChild(g);
    var err = el("p", "err"); err.id = "dt-err"; box.appendChild(err);
    add.addEventListener("click", function () {
      var mins = num(mi.value), n = Date.now(), a;
      if (!(mins > 0) || mins > 24 * 60) { setText(err, "Enter the minutes it was down."); return; }
      if (ti.value) {
        var c = Calc.parseClock(ti.value), dd = Calc.parseDate(state.shift.date), win = Calc.shiftWindow(state.shift);
        if (!c || !dd) { setText(err, "Check the start time."); return; }
        a = new Date(dd.y, dd.mo - 1, dd.d, c.h, c.m).getTime();
        if (win && a < win.start) a = new Date(dd.y, dd.mo - 1, dd.d + 1, c.h, c.m).getTime();
      } else a = n - mins * 60000;
      var b = a + mins * 60000;
      if (b > n + 60000) { setText(err, "That ends in the future. For downtime that's still going, use START DOWNTIME NOW."); return; }
      state.downtime.push({ id: uid("d"), machineId: dtTarget, loggedAt: iso(n), startAt: iso(a), endAt: iso(b), minutes: mins, reason: str(reason.value, 200) });
      save(); tick(); renderDowntime();
    });

    var list = sortedDowntime();
    box.appendChild(el("h3", null, "Downtime this shift · " + list.length));
    if (!list.length) box.appendChild(el("p", "empty", "No downtime logged."));
    list.forEach(function (d, k) {
      var row = el("div", "dt-entry" + (d.endAt ? "" : " run"));
      var tx = el("span", null, entryText(d, r, now)); tx.id = "dtent-" + d.id;
      row.appendChild(tx);
      if (!d.endAt) {
        var eb = el("button", "btn small solid", "END"); eb.type = "button"; eb.id = "dt-end-" + k;
        eb.addEventListener("click", function () { endDown(d); });
        row.appendChild(eb);
      } else {
        var xb = el("button", "btn small warn", "DELETE"); xb.type = "button"; xb.id = "dt-del-" + k;
        xb.addEventListener("click", function () {
          if (!window.confirm("Delete this downtime entry? Its lb go back on the target.")) return;
          state.downtime = state.downtime.filter(function (y) { return y.id !== d.id; }); save(); tick(); renderDowntime();
        });
        row.appendChild(xb);
      }
      box.appendChild(row);
    });

    box.appendChild(el("h3", null, "Totals (taken off the target)"));
    var tot = el("div", "dt-tot");
    state.machines.forEach(function (m, i) {
      var line = el("div"); line.appendChild(el("span", null, m.name));
      var v = el("span", null, ""); v.id = "dttot-" + i; line.appendChild(v); tot.appendChild(line);
    });
    var al = el("div", "all"); al.appendChild(el("span", null, "TOTAL"));
    var av = el("span", null, ""); av.id = "dttot-all"; al.appendChild(av); tot.appendChild(al);
    box.appendChild(tot);
    box.appendChild(el("p", "sub", "Overlapping entries on the same machine count once in the totals."));
    updateDowntimeUI(r, now);
  }

  function updateDowntimeUI(r, now) {
    // dashboard line under the target
    var line = $("d-down");
    if (line) {
      var downNames = state.machines.filter(function (m) { return runningFor(m.id) || runningFor("all"); });
      if (!(r.downMs > 0) && !downNames.length) { if (!line.hidden) line.hidden = true; }
      else {
        line.hidden = false; line.textContent = "";
        if (r.downMs > 0) {
          var tx = "Downtime " + MINUS + fmtDur(r.downMs) + " · " + lbOff(r.downLb);
          if (r.grossTarget) tx += " (target " + fmtInt(r.grossTarget) + " → " + fmtInt(r.target) + ")";
          line.appendChild(el("span", null, tx));
        }
        downNames.forEach(function (m) {
          var d = runningFor(m.id) || runningFor("all");
          line.appendChild(el("span", "red", m.name.toUpperCase() + " DOWN · " + fmtDur(now - Date.parse(d.startAt)) + " · pace car paused"));
        });
      }
    }
    // machine cards
    (r.machines || []).forEach(function (mr, i) {
      var c = cards[mr.id]; if (!c || !c.dtx) return;
      var own = runningFor(mr.id), all = runningFor("all"), d = own || all;
      var t = "", cls = "mc-down-txt";
      if (d) { t = "DOWN " + fmtDur(now - Date.parse(d.startAt)) + " now" + (own ? "" : " (all)") + " · " + lbOff(mr.downLb || 0) + " total"; cls += " red"; }
      else if (mr.downMs > 0) t = "Down " + fmtDur(mr.downMs) + " · " + lbOff(mr.downLb) + " deducted";
      else t = "No downtime";
      setText(c.dtx, t); setCls(c.dtx, cls);
      setText(c.dbt, own ? "BACK UP" : all ? "END ALL DOWN" : "START DOWNTIME");
      setCls(c.dbt, own || all ? "btn small solid" : "btn small warn");
      var card = $("mc-" + i);
      if (card) { var want = d ? " down" : ""; if (card.className.indexOf(" down") >= 0 !== !!d) card.className = card.className.replace(" down", "") + want; }
    });
    // downtime page (live while open)
    if (dtOpen) {
      state.downtime.forEach(function (d) { var e = $("dtent-" + d.id); if (e) setText(e, entryText(d, r, now)); });
      state.machines.forEach(function (m, i) {
        var mr = (r.machines || [])[i], e = $("dttot-" + i);
        if (e && mr) setText(e, fmtDur(mr.downMs || 0) + " · " + lbOff(mr.downLb || 0));
      });
      var ea = $("dttot-all"); if (ea) setText(ea, fmtDur(r.downMs || 0) + " · " + lbOff(r.downLb || 0));
    }
  }

  $("dt-toggle").addEventListener("click", function () {
    dtOpen = !dtOpen;
    $("dtp").hidden = !dtOpen;
    setText($("dt-toggle"), (dtOpen ? "- " : "+ ") + "DOWNTIME");
    $("dt-toggle").setAttribute("aria-expanded", dtOpen ? "true" : "false");
    if (dtOpen) renderDowntime();
  });

  /* ========================= READBACK + RECENT COILS ========================= */
  var rbCoil = null, rbTimer = null, rcOpen = false, rcFilter = "all", rcEdit = null, rcHl = null;
  var RB_MS = 12000;
  function showReadback(c) {
    var m = machineById(c.machineId);
    rbCoil = c.id;
    setText($("rb-w"), fmtLb(c.weight) + " lb");
    setText($("rb-mach"), (m ? m.name : "") + " · " + fmtClock(Date.parse(c.loggedAt)));
    setText($("rb-undo"), "UNDO"); $("rb-undo").disabled = false; setCls($("readback"), "readback");
    setText(document.querySelector("#readback .rb-lbl"), "LOGGED");
    $("readback").hidden = false;
    if (rbTimer) clearTimeout(rbTimer);
    rbTimer = setTimeout(hideReadback, RB_MS);
    if (window.__onReadback) window.__onReadback();
  }
  function hideReadback() { if (rbTimer) clearTimeout(rbTimer); rbTimer = null; rbCoil = null; $("readback").hidden = true; if (window.__onReadback) window.__onReadback(); }
  $("rb-x").addEventListener("click", hideReadback);
  $("rb-undo").addEventListener("click", function () {
    var id = rbCoil; if (!id) return;
    var c = coilById(id);
    state.coils = state.coils.filter(function (x) { return x.id !== id; });
    save(); tick(); if (advOpen) renderAdvanced(); if (rcOpen) renderRecent();
    setText(document.querySelector("#readback .rb-lbl"), "REMOVED"); setCls($("readback"), "readback undone");
    $("rb-undo").disabled = true; rbCoil = null;
    if (rbTimer) clearTimeout(rbTimer); rbTimer = setTimeout(hideReadback, 4000);
    void c;
  });
  $("rb-fix").addEventListener("click", function () { var id = rbCoil; hideReadback(); openRecent(id); });

  function coilById(id) { for (var i = 0; i < state.coils.length; i++) if (state.coils[i].id === id) return state.coils[i]; return null; }
  function recentCoils() {
    return state.coils.filter(function (c) { return rcFilter === "all" || c.machineId === rcFilter; })
      .slice().sort(function (a, b) { return Date.parse(b.loggedAt) - Date.parse(a.loggedAt); }).slice(0, 10);
  }
  function openRecent(hlId) {
    rcOpen = true; rcHl = hlId || null; rcEdit = hlId || null;
    if (hlId) { var c = coilById(hlId); if (c && rcFilter !== "all" && c.machineId !== rcFilter) rcFilter = "all"; }
    $("rcp").hidden = false; setText($("rc-toggle"), "- RECENT COILS"); $("rc-toggle").setAttribute("aria-expanded", "true");
    renderRecent();
    try { $("rc-toggle").scrollIntoView({ block: "start" }); } catch (e) {}
  }
  function closeRecent() {
    rcOpen = false; rcEdit = null; $("rcp").hidden = true;
    setText($("rc-toggle"), "+ RECENT COILS"); $("rc-toggle").setAttribute("aria-expanded", "false");
  }
  function renderRecent() {
    var box = $("rcp"); box.textContent = "";
    if (rcFilter !== "all" && !machineById(rcFilter)) rcFilter = "all";
    box.appendChild(el("p", "sub", "Last 10 coils, newest first. Fix a wrong weight or machine here; every total, the pace car and the projection update."));
    if (state.machines.length > 1) {
      var f = el("div", "rc-filter");
      [["all", "All"]].concat(state.machines.map(function (m) { return [m.id, m.name]; })).forEach(function (o, k) {
        var b = el("button", "btn" + (rcFilter === o[0] ? " on" : ""), o[1]); b.type = "button"; b.id = "rc-f-" + (k ? k - 1 : "all");
        b.addEventListener("click", function () { rcFilter = o[0]; rcEdit = null; renderRecent(); });
        f.appendChild(b);
      });
      box.appendChild(f);
    }
    var list = recentCoils();
    if (!list.length) { box.appendChild(el("p", "empty", "No coils logged yet.")); return; }
    list.forEach(function (c, k) {
      var m = machineById(c.machineId);
      var row = el("div", "rc-row" + (c.id === rcHl ? " hl" : "")); row.id = "rc-" + k;
      var info = el("div");
      info.appendChild(el("span", "rc-w", fmtLb(c.weight) + " lb"));
      info.appendChild(el("span", "rc-meta", fmtClock(Date.parse(c.loggedAt)) + " · " + (m ? m.name : "?") + (c.coilNo ? " · coil " + c.coilNo : "")));
      row.appendChild(info);
      var eb = smallBtn(rcEdit === c.id ? "CLOSE" : "EDIT", "", function () { rcEdit = rcEdit === c.id ? null : c.id; renderRecent(); }); eb.id = "rc-edit-" + k;
      var db = smallBtn("DELETE", "warn", function () {
        askConfirm("Delete the " + fmtLb(c.weight) + " lb coil on " + (m ? m.name : "?") + " (" + fmtClock(Date.parse(c.loggedAt)) + ")?", "Delete it", "Keep it", function () {
          state.coils = state.coils.filter(function (x) { return x.id !== c.id; });
          if (rbCoil === c.id) hideReadback();
          rcEdit = null; save(); tick(); if (advOpen) renderAdvanced(); renderRecent();
        });
      }); db.id = "rc-del-" + k;
      row.appendChild(eb); row.appendChild(db);
      if (rcEdit === c.id) {
        var ed = el("div", "rc-edit");
        var wi = input("text", "rc-w-" + k, String(c.weight), { inputmode: "decimal", autocomplete: "off", "aria-label": "Coil weight in lbs" });
        var ms = el("select", "in"); ms.id = "rc-m-" + k;
        state.machines.forEach(function (mm) { var op = el("option", null, mm.name); op.value = mm.id; ms.appendChild(op); });
        ms.value = c.machineId;
        ed.appendChild(field("Coil weight (lbs)", wi)); ed.appendChild(field("Machine", ms));
        var er = el("p", "err"); er.id = "rc-err-" + k;
        var bs = el("div", "rc-btns");
        var sv = smallBtn("SAVE", "solid", function () {
          checkCoilWeight(wi.value, wi, function (msg) { setText(er, msg); }, function (w) {
            c.weight = w; if (machineById(ms.value)) c.machineId = ms.value;
            rcEdit = null; rcHl = c.id; save(); tick(); if (advOpen) renderAdvanced(); renderRecent();
          });
        }); sv.id = "rc-save-" + k;
        var cx = smallBtn("CANCEL", "", function () { rcEdit = null; renderRecent(); });
        bs.appendChild(sv); bs.appendChild(cx); ed.appendChild(bs); ed.appendChild(er);
        row.appendChild(ed);
      }
      box.appendChild(row);
    });
  }
  $("rc-toggle").addEventListener("click", function () { if (rcOpen) closeRecent(); else openRecent(null); });
  $("rc-open").addEventListener("click", function () { openRecent(null); });

  /* ---------- start ---------- */
  if (state.setupDone) { $("dash").hidden = false; buildDashboard(); tick(); }
  else openWizard(false);
  setInterval(tick, 1000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });
  window.__drawRate = { state: function () { return state; }, compute: function (now) { return Calc.compute(state, now || Date.now()); } };
})();
</script>
</body>
</html>
