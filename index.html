<!DOCTYPE html>
<!--
  DRAW RATE TRACKER v4 - single self-contained offline file (no network, no CDN).

  SAVED DATA  (localStorage key "drawRateV4"; old key "drawRateMulti" is read once
  for migration and never modified). The same shape is used for the JSON export,
  plus "exportedAt" and a computed "summary". Every record has a string id and
  ISO-8601 timestamps so it can be loaded straight into a database.

  {
    "schema": "draw-rate/v4",
    "setupDone": true,                    // false = show the setup wizard
    "shift": {                            // table: shifts
      "id": "s_lx2k9a_ab12c",
      "date": "2026-10-21",               // shift START date (YYYY-MM-DD, local)
      "operator": "D. Smith / 1234",      // optional
      "start": "06:00",                   // HH:MM local, 24h
      "end": "18:00",                     // end <= start means it ends next morning
      "breakMode": "total" | "list",
      "breakTotalMin": 30,                // used when breakMode = "total"
      "breaks": [ { "id": "b_...", "start": "12:00", "minutes": 30 } ],  // breakMode = "list"
      "createdAt": "2026-10-21T10:00:00.000Z",
      "updatedAt": "2026-10-21T10:05:00.000Z"
    },
    "machines": [                         // table: machines (FK shift.id)
      { "id": "m_...", "slot": 1, "name": "Machine 1", "needRate": 2800,   // lb/hr
        "timerStartedAt": null | ISO, "timerAccumMs": 0 }                 // optional run timer
    ],
    "coils": [                            // table: coils (FK machines.id)
      { "id": "c_...", "machineId": "m_...", "loggedAt": ISO, "weight": 450.5,  // lb
        "coilNo": "", "heatNo": "", "size": "", "notes": "",
        "downtimeMin": null | number, "downtimeReason": "" }
    ],
    "downtime": [                         // table: downtime (FK machines.id)
      { "id": "d_...", "machineId": "m_...", "loggedAt": ISO, "minutes": 15, "reason": "" }
    ]
  }

  The math lives in one place: the "CALC MODULE" in the script below. The same formulas are
  re-implemented independently in Python (drtest/calc_check.py) to cross-check them.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030a03">
<title>Draw Rate Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23030a03'/%3E%3Cpath d='M5 23 L12 15 L17 19 L27 8' stroke='%2339ff6a' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #030a03;
    --panel: #061206;
    --fg: #39ff6a;
    --fg-dim: #1f9a3e;
    --fg-faint: rgba(57, 255, 106, 0.16);
    --amber: #ffc23d;
    --red: #ff5f56;
    --white: #eaffea;
    --font: "Courier New", Courier, "Noto Sans Mono", "DejaVu Sans Mono", "Droid Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); }
  body { line-height: 1.4; }
  [hidden] { display: none !important; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  .wrap { max-width: 46rem; margin: 0 auto; padding: 1rem 1rem 3rem; }
  .glow { text-shadow: 0 0 6px rgba(57, 255, 106, 0.45); }
  .amber { color: var(--amber); }
  .red { color: var(--red); }
  .green { color: var(--fg); }
  .white { color: var(--white); }
  .dim { color: var(--fg-dim); }
  .lbl { color: var(--amber); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; }
  .sub { color: var(--fg-dim); font-size: 0.85rem; }
  .err { color: var(--red); min-height: 1.3em; margin: 0.75rem 0 0; }

  /* inputs + buttons */
  .in {
    width: 100%; min-width: 0; height: 3.25rem; padding: 0 0.85rem;
    background: #000; color: var(--white); border: 2px solid var(--fg-dim); border-radius: 3px;
    font-size: 1.25rem; font-variant-numeric: tabular-nums; color-scheme: dark;
    -webkit-appearance: none; appearance: none;
  }
  .in:focus { outline: none; border-color: var(--fg); box-shadow: 0 0 10px rgba(57, 255, 106, 0.35); }
  .in::placeholder { color: rgba(57, 255, 106, 0.35); }
  textarea.in { height: auto; padding: 0.6rem 0.85rem; font-size: 1rem; }
  .btn {
    min-height: 3.25rem; padding: 0.5rem 1rem; border: 2px solid var(--fg); border-radius: 3px;
    background: transparent; color: var(--fg); font-weight: 700; letter-spacing: 0.08em;
    cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .btn:active { background: var(--fg); color: #000; }
  .btn.solid { background: var(--fg); color: #000; }
  .btn.solid:active { background: var(--white); }
  .btn.warn { border-color: var(--red); color: var(--red); }
  .btn.small { min-height: 2.5rem; padding: 0.3rem 0.7rem; font-size: 0.85rem; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .link { background: none; border: 0; color: var(--amber); text-decoration: underline; cursor: pointer; padding: 0.5rem; font-size: 0.9rem; }

  /* wizard */
  .wz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .wz-brand { color: var(--amber); font-weight: 700; letter-spacing: 0.2em; }
  .wz-step { color: var(--fg-dim); font-size: 0.85rem; letter-spacing: 0.1em; }
  .wz-progress { height: 4px; background: var(--fg-faint); margin-bottom: 2rem; }
  .wz-progress > div { height: 100%; background: var(--fg); width: 0; }
  #wz-title { color: var(--white); font-size: 1.5rem; margin: 0 0 0.5rem; letter-spacing: 0.04em; }
  .help { color: var(--fg-dim); margin: 0 0 1.5rem; }
  .field { margin-bottom: 1.25rem; }
  .field > label { display: block; margin-bottom: 0.4rem; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 1.25rem; }
  .seg .btn.on { background: var(--fg); color: #000; }
  .count-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
  .count-grid .btn { min-height: 4.5rem; font-size: 1.75rem; }
  .count-grid .btn.on { background: var(--fg); color: #000; }
  .break-row { display: grid; grid-template-columns: 1fr 7rem 3.25rem; gap: 0.5rem; margin-bottom: 0.6rem; align-items: end; }
  .mach-row { padding: 1rem 0; border-top: 1px solid var(--fg-faint); }
  .mach-row:first-child { border-top: 0; padding-top: 0; }
  .wz-nav { display: grid; grid-template-columns: 1fr 2fr; gap: 0.75rem; margin-top: 2rem; }
  .calc-note { margin-top: 0.5rem; color: var(--amber); }
  .review { width: 100%; border-collapse: collapse; }
  .review td { padding: 0.55rem 0; border-bottom: 1px solid var(--fg-faint); vertical-align: top; }
  .review td:first-child { color: var(--amber); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; width: 40%; }
  .review td:last-child { color: var(--white); text-align: right; }

  /* dashboard */
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .brand { color: var(--amber); font-weight: 700; letter-spacing: 0.2em; font-size: 1.1rem; }
  .clock { color: var(--white); font-size: 1.1rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .phase { margin: 1rem 0 1.5rem; padding: 0.5rem 0.75rem; background: var(--panel); color: var(--fg); font-size: 0.9rem; letter-spacing: 0.05em; }
  .phase.amber { color: var(--amber); }
  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .big { font-size: 2.6rem; font-weight: 700; line-height: 1.1; color: var(--white); font-variant-numeric: tabular-nums; margin-top: 0.2rem; overflow-wrap: anywhere; }
  .big.pc { color: var(--fg); }
  .unit { font-size: 0.85rem; color: var(--fg-dim); }
  .bar { position: relative; height: 10px; background: var(--fg-faint); margin: 1.25rem 0 0.4rem; }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--fg); width: 0; }
  .bar .mark { position: absolute; top: -5px; bottom: -5px; width: 3px; background: var(--amber); left: 0; margin-left: -1px; }
  .legend { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.8rem; color: var(--fg-dim); }
  .block { margin-top: 2rem; }
  .block > .lbl { display: block; margin-bottom: 0.6rem; }
  .delta { font-size: 2.1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .delta .pct { font-size: 1.5rem; margin-left: 0.75rem; }
  .rows { margin: 0; }
  .rows > div { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 0.6rem 0; border-bottom: 1px solid var(--fg-faint); }
  .rows > div:last-child { border-bottom: 0; }
  .rows dt { color: var(--fg-dim); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .rows dd { margin: 0; color: var(--white); font-size: 1.15rem; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .rows dd.green, .mc-stats b.green { color: var(--fg); }
  .rows dd.amber, .mc-stats b.amber { color: var(--amber); }
  .rows dd.red, .mc-stats b.red { color: var(--red); }
  .note { color: var(--amber); font-size: 0.85rem; margin: 0.6rem 0 0; }
  .machines { display: grid; grid-template-columns: 1fr; gap: 1rem; }
  .mc { background: var(--panel); padding: 1rem; border-left: 3px solid var(--fg-dim); }
  .mc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; margin-bottom: 0.75rem; }
  .mc-name { color: var(--white); font-weight: 700; font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .mc-rate { color: var(--fg-dim); font-size: 0.8rem; white-space: nowrap; }
  .mc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.9rem; }
  .mc-stats b { display: block; color: var(--white); font-size: 1.2rem; font-variant-numeric: tabular-nums; margin-top: 0.15rem; }
  .mc-log { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; }
  .mc-log .btn { padding: 0.5rem 1.1rem; }
  .mc-last { margin-top: 0.5rem; min-height: 1.2em; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 2.5rem; }
  .adv-toggle { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--fg-faint); border-bottom: 1px solid var(--fg-faint); color: var(--amber); padding: 1rem 0; letter-spacing: 0.15em; font-weight: 700; cursor: pointer; }

  /* advanced */
  .adv-mach { margin-top: 1.5rem; }
  .adv-mach h3 { color: var(--white); font-size: 1rem; margin: 0 0 0.6rem; letter-spacing: 0.06em; }
  .adv-line { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
  .coil-tbl { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  .coil-tbl th { color: var(--amber); font-weight: 400; font-size: 0.7rem; letter-spacing: 0.1em; text-align: left; padding: 0.3rem 0.25rem; border-bottom: 1px solid var(--fg-faint); }
  .coil-tbl td { padding: 0.45rem 0.25rem; border-bottom: 1px solid var(--fg-faint); vertical-align: top; }
  .coil-tbl td.r, .coil-tbl th.r { text-align: right; }
  .coil-tbl .meta { color: var(--fg-dim); font-size: 0.8rem; }
  .edit-box { background: var(--panel); padding: 0.75rem; }
  .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .edit-grid .full { grid-column: 1 / -1; }
  .edit-grid .in { height: 2.75rem; font-size: 1rem; }
  .dt-form { display: grid; grid-template-columns: 6rem 1fr auto; gap: 0.5rem; }
  .dt-form .in { height: 2.75rem; font-size: 1rem; }
  .export { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .empty { color: var(--fg-dim); padding: 0.6rem 0; }
  .text-center { text-align: center; }

  @media (min-width: 640px) {
    .wrap { padding: 1.75rem 1.75rem 3rem; }
    .big { font-size: 3.6rem; }
    .delta { font-size: 2.6rem; }
    .machines { grid-template-columns: 1fr 1fr; }
    .count-grid { grid-template-columns: repeat(6, 1fr); }
  }
  @media (max-width: 360px) {
    .big { font-size: 2.1rem; }
    .delta { font-size: 1.7rem; }
    .delta .pct { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <section id="wizard" hidden>
    <div class="wz-top">
      <span class="wz-brand glow">DRAW RATE</span>
      <span class="wz-step" id="wz-step"></span>
    </div>
    <div class="wz-progress"><div id="wz-bar"></div></div>
    <h2 id="wz-title"></h2>
    <p id="wz-help" class="help"></p>
    <div id="wz-body"></div>
    <p id="wz-error" class="err" role="alert"></p>
    <div class="wz-nav">
      <button type="button" class="btn" id="wz-back">BACK</button>
      <button type="button" class="btn solid" id="wz-next">NEXT</button>
    </div>
    <p class="text-center"><button type="button" class="link" id="wz-cancel" hidden>Cancel, back to dashboard</button></p>
  </section>

  <section id="dash" hidden>
    <header class="top">
      <div>
        <div class="brand glow">DRAW RATE</div>
        <div class="sub" id="d-shift"></div>
      </div>
      <div class="clock" id="d-clock"></div>
    </header>
    <p class="phase" id="d-phase"></p>

    <div class="hero">
      <div>
        <div class="lbl">Lbs ran</div>
        <div class="big glow" id="d-ran">0</div>
      </div>
      <div>
        <div class="lbl">Pace car</div>
        <div class="big pc glow" id="d-pc">0</div>
        <div class="unit">lb you should have by now</div>
      </div>
    </div>
    <div class="bar" aria-hidden="true"><div class="fill" id="d-fill"></div><div class="mark" id="d-mark"></div></div>
    <div class="legend"><span id="d-of-target"></span><span id="d-target"></span></div>

    <section class="block">
      <span class="lbl" id="d-delta-lbl">Deficit / surplus</span>
      <div class="delta" id="d-delta"><span id="d-delta-lb">—</span><span class="pct" id="d-delta-pct"></span></div>
      <div class="sub" id="d-delta-note"></div>
    </section>

    <section class="block">
      <span class="lbl">Projection at current pace</span>
      <dl class="rows">
        <div><dt>Current pace</dt><dd id="p-pace">—</dd></div>
        <div><dt>Projected finish</dt><dd id="p-proj">—</dd></div>
        <div><dt>vs day target</dt><dd id="p-vs">—</dd></div>
        <div><dt>Hit target at</dt><dd id="p-hit">—</dd></div>
        <div><dt>Catch-up rate</dt><dd id="p-catch">—</dd></div>
      </dl>
      <p class="note" id="p-note"></p>
    </section>

    <section class="block">
      <span class="lbl">Machines</span>
      <div class="machines" id="d-machines"></div>
    </section>

    <section class="block">
      <button type="button" class="adv-toggle" id="adv-toggle" aria-expanded="false">+ ADVANCED</button>
      <div id="adv" hidden></div>
    </section>

    <div class="actions">
      <button type="button" class="btn" id="btn-edit">EDIT SETUP</button>
      <button type="button" class="btn warn" id="btn-new">NEW SHIFT</button>
    </div>
  </section>

  <p class="text-center"><a class="link" href="app/">Phone app (installable, works offline)</a></p>
</div>
<script>
/* =====================================================================
   CALC MODULE - every number on the dashboard comes from Calc.compute().
   Pure functions: no DOM, no storage. Mirrored in drtest/calc_check.py.

   Definitions (all times are local wall-clock, ms since epoch):
     shift window   start = shift.date @ shift.start
                    end   = shift.date @ shift.end; if end <= start (clock-wise)
                            the shift ends the NEXT day (overnight).
     breaks         list mode : each break starts at its clock time inside the
                                window (a time earlier than the start time means
                                the next day) and lasts its minutes.
                    total mode: one block of breakTotalMin centred on the
                                middle of the shift.
                    Breaks are clipped to the window and merged when they overlap.
     worked(a,b)    ms between a and b that fall inside the window and outside breaks.
     W              worked hours for the whole shift = worked(start, end)
     t              now clamped into [start, end]
     w              worked hours so far = worked(start, t);  left = W - w
     fraction       w / W
     day target     T  = W x sum(needRate of every configured machine)
     pace car       PC = fraction x T                 (per machine: fraction x W x rate)
     lbs ran        L  = sum of coil weights
     deficit/surplus  D = L - PC;  D% = D / PC x 100   (blank while PC = 0)
     current pace   P  = L / w   (only once w >= 10 min; blank before that)
     projected      L + P x left                       (P must exist)
     proj vs target (L + P x left) - T, and that / T x 100
     hit target at  if L >= T: already hit. Else if P > 0 and shift not over:
                    the clock time after (T - L) / P more WORKED hours from now
                    (breaks skipped; after the shift end time runs straight on).
                    early/late = hit time - end (negative = early).
     catch-up rate  (T - L) / left   (0 once the target is hit; blank when < 1 min left)
   ===================================================================== */
var Calc = (function () {
  "use strict";
  var MIN = 60000, HOUR = 3600000;
  var PACE_MIN_WORKED_MS = 10 * MIN;   // don't project from the first few minutes

  function parseClock(s) {
    if (typeof s !== "string") return null;
    var m = /^(\d{1,2}):(\d{2})$/.exec(s);
    if (!m) return null;
    var h = +m[1], mi = +m[2];
    if (h > 23 || mi > 59) return null;
    return { h: h, m: mi };
  }
  function parseDate(s) {
    if (typeof s !== "string") return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (!m) return null;
    var d = { y: +m[1], mo: +m[2], d: +m[3] };
    if (d.mo < 1 || d.mo > 12 || d.d < 1 || d.d > 31) return null;
    return d;
  }
  function at(d, c, plusDays) {
    return new Date(d.y, d.mo - 1, d.d + (plusDays || 0), c.h, c.m, 0, 0).getTime();
  }

  function shiftWindow(shift) {
    if (!shift) return null;
    var d = parseDate(shift.date), s = parseClock(shift.start), e = parseClock(shift.end);
    if (!d || !s || !e) return null;
    if (s.h === e.h && s.m === e.m) return null;
    var start = at(d, s), end = at(d, e);
    var overnight = (e.h * 60 + e.m) < (s.h * 60 + s.m);
    if (overnight) end = at(d, e, 1);
    return { start: start, end: end, overnight: overnight };
  }

  function breakIntervals(shift, win) {
    var raw = [], d = parseDate(shift.date);
    if (shift.breakMode === "list") {
      (shift.breaks || []).forEach(function (b) {
        var c = parseClock(b && b.start), mins = Number(b && b.minutes);
        if (!c || !(mins > 0)) return;
        var t = at(d, c);
        if (t < win.start) t = at(d, c, 1);
        raw.push([t, t + mins * MIN]);
      });
    } else {
      var len = Number(shift.breakTotalMin) * MIN;
      if (len > 0) {
        var mid = win.start + (win.end - win.start) / 2;
        raw.push([mid - len / 2, mid + len / 2]);
      }
    }
    var clipped = [];
    raw.forEach(function (r) {
      var a = Math.max(r[0], win.start), b = Math.min(r[1], win.end);
      if (b > a) clipped.push([a, b]);
    });
    clipped.sort(function (x, y) { return x[0] - y[0]; });
    var merged = [];
    clipped.forEach(function (r) {
      var last = merged[merged.length - 1];
      if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
      else merged.push([r[0], r[1]]);
    });
    return merged;
  }

  function worked(win, breaks, a, b) {
    a = Math.max(a, win.start); b = Math.min(b, win.end);
    if (b <= a) return 0;
    var ms = b - a;
    breaks.forEach(function (r) {
      var o = Math.min(b, r[1]) - Math.max(a, r[0]);
      if (o > 0) ms -= o;
    });
    return ms;
  }

  // Clock time reached after `workMs` more worked time starting at `from`.
  function addWorked(win, breaks, from, workMs) {
    var cursor = from;
    for (var i = 0; i < breaks.length; i++) {
      var r = breaks[i];
      if (r[1] <= cursor) continue;
      if (r[0] > cursor) {
        var gap = r[0] - cursor;
        if (workMs <= gap) return cursor + workMs;
        workMs -= gap;
      }
      cursor = Math.max(cursor, r[1]);
    }
    return cursor + workMs;
  }

  function coilTime(c) { var t = Date.parse(c.loggedAt); return isFinite(t) ? t : 0; }

  function compute(state, now) {
    var shift = state.shift || {}, machines = state.machines || [], coils = state.coils || [];
    var byId = {};
    machines.forEach(function (m) { byId[m.id] = 0; });
    coils.forEach(function (c) { if (byId.hasOwnProperty(c.machineId)) byId[c.machineId] += c.weight; });
    var L = 0;
    machines.forEach(function (m) { L += byId[m.id]; });

    var out = { phase: "invalid", lbsRan: L, machines: [] };
    var win = shiftWindow(shift);
    var breaks = win ? breakIntervals(shift, win) : [];
    var Wms = win ? worked(win, breaks, win.start, win.end) : 0;
    if (!win || Wms <= 0) {
      out.machines = machines.map(function (m) { return { id: m.id, lbs: byId[m.id], target: null, paceCar: null, delta: null, deltaPct: null }; });
      return out;
    }
    var t = Math.min(Math.max(now, win.start), win.end);
    var wms = worked(win, breaks, win.start, t);
    var leftMs = Wms - wms;
    var fraction = wms / Wms;

  }

  function validateStep() {
    var step = STEPS[wz.step], d = wz.draft;
    if (step === "schedule") {
      if (!Calc.parseDate(d.date)) return "Enter the shift date.";
      if (!okClock(d.start)) return "Enter the shift start time.";
      if (!okClock(d.end)) return "Enter the shift end time.";
      if (d.start === d.end) return "Start and end can't be the same time.";
    }
    if (step === "breaks") {
      var nums = draftNumbers(d);
      if (d.breakMode === "list") {
        for (var i = 0; i < d.breaks.length; i++) {
          var b = d.breaks[i];
          if (!okClock(b.start)) return "Enter a start time for break " + (i + 1) + ", or remove it.";
          if (!(num(b.minutes) > 0)) return "Enter the minutes for break " + (i + 1) + ".";
          var one = draftShift(d); one.breaks = [b];
          var w = Calc.shiftWindow(one), iv = Calc.breakIntervals(one, w);
          var inside = iv.length ? iv[0][1] - iv[0][0] : 0;
          if (inside < b.minutes * 60000 - 1) return "Break " + (i + 1) + " (" + fmtHHMM(b.start) + ") falls outside the shift.";
        }
      } else if (!(num(d.breakTotalMin) >= 0)) return "Enter total break minutes (0 if none).";
      if (!nums || nums.worked <= 0) return "Breaks take up the whole shift. Check the minutes.";
    }
    if (step === "machines") {
      for (var j = 0; j < d.machines.length; j++) {
        var m = d.machines[j];
        if (!(num(m.needRate) > 0 && num(m.needRate) < 1e6)) return "Enter a need rate (lb/hr) for " + (m.name || "machine " + (j + 1)) + ".";
      }
    }
    return "";
  }

  function wizardNext() {
    var err = validateStep();
    if (err) { setText($("wz-error"), err); return; }
    if (wz.step < STEPS.length - 1) { wz.step++; renderWizard(); window.scrollTo(0, 0); return; }
    submitWizard();
  }

  function submitWizard() {
    var d = wz.draft;
    // machines being removed that still have coils
    var keepIds = {};
    d.machines.forEach(function (m) { if (m.id) keepIds[m.id] = true; });
    var dropped = state.machines.filter(function (m) { return !keepIds[m.id] && coilsOf(m.id).length; });
    if (dropped.length && !window.confirm("Removing " + dropped.map(function (m) { return m.name; }).join(", ") +
      " also deletes its logged coils. Continue?")) return;
    var old = {};
    state.machines.forEach(function (m) { old[m.id] = m; });
    state.machines = d.machines.map(function (m, i) {
      var prev = m.id && old[m.id];
      var name = (m.name || "").replace(/^\s+|\s+$/g, "") || "Machine " + (i + 1);
      return { id: prev ? prev.id : uid("m"), slot: i + 1, name: name.slice(0, 40), needRate: num(m.needRate),
        timerStartedAt: prev ? prev.timerStartedAt : null, timerAccumMs: prev ? prev.timerAccumMs : 0 };
    });
    var ids = {}; state.machines.forEach(function (m) { ids[m.id] = true; });
    state.coils = state.coils.filter(function (c) { return ids[c.machineId]; });
    state.downtime = state.downtime.filter(function (x) { return ids[x.machineId]; });
    var s = state.shift;
    s.date = d.date; s.start = d.start; s.end = d.end; s.operator = str(d.operator, 60).replace(/^\s+|\s+$/g, "");
    s.breakMode = d.breakMode === "list" ? "list" : "total";
    s.breakTotalMin = num(d.breakTotalMin) >= 0 ? num(d.breakTotalMin) : 0;
    s.breaks = s.breakMode === "list" ? d.breaks.map(function (b) { return { id: b.id || uid("b"), start: b.start, minutes: num(b.minutes) }; }) : [];
    state.setupDone = true;
    delete state.migrated;
    save();
    closeWizard();
  }

  $("wz-next").addEventListener("click", wizardNext);
  $("wz-back").addEventListener("click", function () { if (wz && wz.step > 0) { wz.step--; renderWizard(); } });
  $("wz-cancel").addEventListener("click", function () { closeWizard(); });
  $("wz-body").addEventListener("input", function () { setText($("wz-error"), ""); });
  $("wz-body").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.tagName === "INPUT") { e.preventDefault(); wizardNext(); }
  });

  /* ========================= DASHBOARD ========================= */
  var cards = {};      // machineId -> { name, rate, ran, pc, dl, input, last }
  var advOpen = false, editingCoil = null, lastLogged = {};

  function buildDashboard() {
    var box = $("d-machines");
    box.textContent = "";
    cards = {};
    state.machines.forEach(function (m, i) {
      var c = el("div", "mc"); c.id = "mc-" + i;
      var head = el("div", "mc-head");
      var nm = el("span", "mc-name", m.name), rt = el("span", "mc-rate", "need " + fmtInt(m.needRate) + " lb/hr");
      head.appendChild(nm); head.appendChild(rt); c.appendChild(head);
      var stats = el("div", "mc-stats");
      var mk = function (label) { var dv = el("div"); dv.appendChild(el("span", "lbl", label)); var b = el("b", null, "—"); dv.appendChild(b); stats.appendChild(dv); return b; };
      var ran = mk("Ran"), pc = mk("Pace car"), dl = mk("+/-");
      c.appendChild(stats);
      var log = el("div", "mc-log");
      var inp = input("number", "log-" + i, "", { inputmode: "decimal", min: "0", step: "0.1", placeholder: "Coil lb", "aria-label": "Coil weight for " + m.name });
      var btn = el("button", "btn solid", "LOG COIL"); btn.type = "button"; btn.id = "logbtn-" + i;
      var last = el("div", "mc-last sub");
      btn.addEventListener("click", function () { logCoil(m.id, inp, last); });
      inp.addEventListener("input", function () { if (last.className.indexOf("red") >= 0) { setCls(last, "mc-last sub"); lastLogged[m.id] = true; tick(); } });
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); logCoil(m.id, inp, last); } });
      log.appendChild(inp); log.appendChild(btn); c.appendChild(log); c.appendChild(last);
      box.appendChild(c);

  }

  function logCoil(machineId, inp, lastEl) {
    var w = num(inp.value);
    if (!(w > 0) || w >= 1e6) { setText(lastEl, "Enter a coil weight greater than 0."); setCls(lastEl, "mc-last red"); return; }
    var c = { id: uid("c"), machineId: machineId, loggedAt: iso(Date.now()), weight: w, coilNo: "", heatNo: "",
      size: "", notes: "", downtimeMin: null, downtimeReason: "" };
    state.coils.push(c);
    lastLogged[machineId] = c.id;
    inp.value = "";
    save();
    tick();
    if (advOpen) renderAdvanced();
  }

  function colorFor(pct) { return pct == null ? "white" : pct >= 0 ? "green" : pct > -5 ? "amber" : "red"; }

  function tick() {
    if (!state.setupDone || !$("wizard").hidden) return;
    var now = Date.now(), r = Calc.compute(state, now);
    setText($("d-clock"), fmtClock(now, true));
    var ph = $("d-phase"), phase = "", phCls = "phase";
    if (r.phase === "invalid") { phase = "SETUP INCOMPLETE · tap EDIT SETUP"; phCls = "phase amber"; }
    else if (r.phase === "before") { phase = "SHIFT STARTS " + fmtClockDay(r.start, now) + " · in " + fmtDur(r.start - now); phCls = "phase amber"; }
    else if (r.phase === "after") { phase = "SHIFT OVER · final numbers"; phCls = "phase amber"; }
    else if (r.onBreakUntil) { phase = "ON BREAK until " + fmtClock(r.onBreakUntil) + " · pace car paused"; phCls = "phase amber"; }
    else phase = "ON SHIFT · " + fmtDur(r.workedSoFarMs) + " worked · " + fmtDur(r.workedLeftMs) + " left";
    setText(ph, phase); setCls(ph, phCls);

    setText($("d-ran"), fmtInt(r.lbsRan));
    setText($("d-pc"), r.paceCar == null ? "—" : fmtInt(r.paceCar));
    var T = r.target;
    $("d-fill").style.width = T ? Math.min(100, r.lbsRan / T * 100) + "%" : "0";
    $("d-mark").style.left = T ? Math.min(100, r.paceCar / T * 100) + "%" : "0";
    setText($("d-of-target"), T ? fmtW(r.lbsRan / T * 100) + "% of day target" : "");
    setText($("d-target"), T ? "TARGET " + fmtInt(T) + " lb" : "");

    // deficit / surplus
    var col = colorFor(r.deltaPct);
    if (r.paceCar == null || r.phase === "before" || r.paceCar <= 0) {
      setText($("d-delta-lbl"), "Deficit / surplus");
      setText($("d-delta-lb"), "—"); setText($("d-delta-pct"), "");
      setCls($("d-delta"), "delta white");
      setText($("d-delta-note"), r.phase === "before" ? "Starts when the shift starts." : "");
    } else {
      setText($("d-delta-lbl"), r.delta >= 0 ? "Surplus" : "Deficit");
      setText($("d-delta-lb"), fmtSigned(r.delta) + " lb");
      setText($("d-delta-pct"), fmtPct(r.deltaPct));
      setCls($("d-delta"), "delta glow " + col);
      setText($("d-delta-note"), (r.delta >= 0 ? "ahead of" : "behind") + " the pace car");
    }

    // projection
    var note = "";
    if (r.phase === "invalid") {
      ["p-pace", "p-proj", "p-vs", "p-hit", "p-catch"].forEach(function (id) { setText($(id), "—"); });
    } else {
      var paceOk = r.pace != null && r.pace > 0;
      setText($("p-pace"), paceOk ? fmtInt(r.pace) + " lb/hr" : "—");
      setText($("p-proj"), paceOk || r.phase === "after" ? fmtInt(r.projected == null ? r.lbsRan : r.projected) + " lb" : "—");
      var vsTxt = "—", vsCls = "";
      if (paceOk || r.phase === "after") {
        var pv = r.projected == null ? r.lbsRan : r.projected, pd = pv - T;
        vsTxt = fmtSigned(pd) + " lb · " + fmtPct(pd / T * 100);
        vsCls = colorFor(pd / T * 100);
      }
      setText($("p-vs"), vsTxt); setCls($("p-vs"), vsCls);
      var hit = "—", hitCls = "";
      if (r.targetHit) { hit = "TARGET HIT"; hitCls = "green"; }
      else if (r.hitAt != null) {
        var early = r.hitVsEndMs <= 0;
        hit = fmtClockDay(r.hitAt, now) + " · " + fmtDur(Math.abs(r.hitVsEndMs)) + (early ? " early" : " late");
        hitCls = early ? "green" : "red";
      } else if (r.phase === "after") { hit = "Missed by " + fmtInt(T - r.lbsRan) + " lb"; hitCls = "red"; }
      setText($("p-hit"), hit); setCls($("p-hit"), hitCls);
      var cu = "—", cuCls = "";
      if (r.targetHit) { cu = "0 · target hit"; cuCls = "green"; }
      else if (r.catchUp != null && r.phase !== "after") { cu = fmtInt(r.catchUp) + " lb/hr"; cuCls = r.catchUp <= r.rateSum ? "" : "red"; }
      setText($("p-catch"), cu); setCls($("p-catch"), cuCls);

      if (r.phase === "before") note = "Projection starts once you have 10 minutes on the clock.";
      else if (r.phase === "after") note = r.targetHit ? "Shift over. Target made." : "Shift over.";
      else if (r.pace == null) note = "Projection starts after 10 minutes worked (" + fmtDur(r.paceWaitMs) + " to go).";
      else if (r.pace === 0) note = "No lbs logged yet. Log a coil to see a projection.";
      else if (r.onBreakUntil) note = "On break: the clock and pace car are paused.";
    }
    setText($("p-note"), note);

    // machines
    r.machines.forEach(function (mr) {
      var c = cards[mr.id]; if (!c) return;
      setText(c.ran, fmtInt(mr.lbs));
      setText(c.pc, mr.paceCar == null ? "—" : fmtInt(mr.paceCar));
      setText(c.dl, mr.deltaPct == null || r.phase === "before" ? "—" : fmtPct(mr.deltaPct));
      setCls(c.dl, mr.deltaPct == null || r.phase === "before" ? "" : colorFor(mr.deltaPct));
      var lc = null, list = coilsOf(mr.id);
      if (list.length) lc = list[list.length - 1];
      var t = lc ? "Last coil " + fmtW(lc.weight) + " lb at " + fmtClock(Date.parse(lc.loggedAt)) + " · " + list.length + " coil" + (list.length === 1 ? "" : "s") : "No coils yet";
      if (c.last.className.indexOf("red") < 0 || lastLogged[mr.id]) { setText(c.last, t); setCls(c.last, "mc-last sub"); }
      lastLogged[mr.id] = null;
    });

    // advanced timers
    state.machines.forEach(function (m, i) {
      var te = $("timer-" + i);
      if (te) setText(te, fmtTimer(m, now));
    });
  }

  function fmtTimer(m, now) {
    var ms = m.timerAccumMs + (m.timerStartedAt ? Math.max(0, now - Date.parse(m.timerStartedAt)) : 0);
    var s = Math.floor(ms / 1000);
    return Math.floor(s / 3600) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60);
  }

  /* ---------- export ---------- */

  function summary() {
    var r = Calc.compute(state, Date.now());
    return { computedAt: iso(Date.now()), phase: r.phase, workedHours: r.workedTotalMs != null ? r.workedTotalMs / 3600000 : null,
      dayTargetLb: r.target != null ? r.target : null, lbsRan: r.lbsRan, paceCarLb: r.paceCar != null ? r.paceCar : null,
      deltaLb: r.delta != null ? r.delta : null, deltaPct: r.deltaPct != null ? r.deltaPct : null,
      currentPaceLbHr: r.pace != null ? r.pace : null, projectedLb: r.projected != null ? r.projected : null,
      hitTargetAt: r.hitAt != null ? iso(r.hitAt) : null, catchUpLbHr: r.catchUp != null ? r.catchUp : null };
  }
  function exportJSON() {
    return JSON.stringify({ schema: SCHEMA, exportedAt: iso(Date.now()), shift: state.shift, machines: state.machines,
      coils: state.coils, downtime: state.downtime, summary: summary() }, null, 2);
  }
  function csvCell(v) {

    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function exportCSV() {
    var s = state.shift;
    var breaks = s.breakMode === "list" ? s.breaks.map(function (b) { return b.start + "/" + b.minutes; }).join(" ") : s.breakTotalMin + " total";
    var head = ["record_type", "shift_id", "shift_date", "operator", "shift_start", "shift_end", "breaks", "machine_id", "machine_slot",
      "machine_name", "need_rate_lb_hr", "record_id", "logged_at", "weight_lb", "coil_no", "heat_no", "size", "notes", "downtime_min", "downtime_reason"];
    var rows = [head];
    var mrow = function (type, m, rec) {
      return [type, s.id, s.date, s.operator, s.start, s.end, breaks, m.id, m.slot, m.name, m.needRate].concat(rec);
    };
    state.machines.forEach(function (m) {
      rows.push(mrow("machine", m, ["", "", "", "", "", "", "", "", ""]));
      coilsOf(m.id).forEach(function (c) {
        rows.push(mrow("coil", m, [c.id, c.loggedAt, c.weight, c.coilNo, c.heatNo, c.size, c.notes, c.downtimeMin, c.downtimeReason]));
      });
      state.downtime.filter(function (d) { return d.machineId === m.id; }).forEach(function (d) {
        rows.push(mrow("downtime", m, [d.id, d.loggedAt, "", "", "", "", "", d.minutes, d.reason]));
      });
    });
    return rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n") + "\r\n";
  }
  function download(name, text, type) {
    try {
      var blob = new Blob([text], { type: type + ";charset=utf-8" });
      if (window.navigator && window.navigator.msSaveOrOpenBlob) { window.navigator.msSaveOrOpenBlob(blob, name); return; }
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = name; a.style.display = "none";
      document.body.appendChild(a); a.click();
      setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
      setText($("ex-msg"), "Saved " + name + " to Downloads.");
    } catch (e) { setText($("ex-msg"), "Download blocked here. Use COPY instead."); }
  }
  function copyText(text, msgEl) {
    var done = function () { setText(msgEl, "Copied to clipboard."); };
    var fallback = function () {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "-1000px";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      setText(msgEl, ok ? "Copied to clipboard." : "Copy blocked here. Use DOWNLOAD instead.");
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  /* ---------- top-level actions ---------- */
  $("adv-toggle").addEventListener("click", function () {
    advOpen = !advOpen;
    $("adv").hidden = !advOpen;
    setText($("adv-toggle"), (advOpen ? "- " : "+ ") + "ADVANCED");
    $("adv-toggle").setAttribute("aria-expanded", advOpen ? "true" : "false");
    if (advOpen) renderAdvanced();
  });
  $("btn-edit").addEventListener("click", function () { openWizard(true); });
  $("btn-new").addEventListener("click", function () {
    if (!window.confirm("Start a new shift? This clears today's coils and downtime. Your schedule and machines stay as defaults.")) return;
    var now = Date.now();
    state.coils = []; state.downtime = [];
    state.shift.id = uid("s"); state.shift.date = todayStr(); state.shift.createdAt = iso(now);
    state.machines.forEach(function (m) { m.timerStartedAt = null; m.timerAccumMs = 0; });
    state.setupDone = false; editingCoil = null;
    save();
    openWizard(false);
  });

  /* ---------- start ---------- */
  if (state.setupDone) { $("dash").hidden = false; buildDashboard(); tick(); }
  else openWizard(false);
  setInterval(tick, 1000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });
  window.__drawRate = { state: function () { return state; }, compute: function (now) { return Calc.compute(state, now || Date.now()); } };
})();
</script>
