<script>
/* PHONE FIT: if the phone browser is set to "Request Desktop Website" it lays the page out
   about 980px wide and shrinks it to fit, so everything looks tiny. Spot that (small touch
   screen, much wider layout) and zoom the page back up to real phone size. */
(function () {
  var d = document.documentElement, last = "";
  function fit() {
    var key = (window.innerWidth > window.innerHeight ? "L" : "P") + screen.width + "x" + screen.height;
    if (key === last) return; last = key;
    d.style.zoom = ""; d.classList.remove("fit");
    var lw = d.clientWidth || window.innerWidth, lh = d.clientHeight || window.innerHeight;
    var sw = screen.width, sh = screen.height, dw = lw > lh ? Math.max(sw, sh) : Math.min(sw, sh);
    if (navigator.maxTouchPoints > 0 && dw > 0 && dw < 600 && lw > dw * 1.3) {
      var z = lw / dw;
      d.style.zoom = z.toFixed(4); d.classList.add("fit");
      d.style.setProperty("--fvw", (lw / z / 100).toFixed(3) + "px");
      d.style.setProperty("--fvh", (lh / z / 100).toFixed(3) + "px");
    }
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function () { last = ""; setTimeout(fit, 250); });
})();
</script>

<style>
:root{--bg:#030a03;--panel:#061206;--fg:#39ff6a;--fg-dim:#1f9a3e;--fg-faint:rgba(57,255,106,.16);--amber:#ffc23d;--red:#ff5f56;--white:#eaffea;--ph:#5f7a63;
--font:"Courier New",Courier,"Noto Sans Mono","DejaVu Sans Mono","Droid Sans Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;-webkit-text-size-adjust:100%}
body{padding:0 12px calc(40px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;overflow-x:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 10px;border-bottom:1px solid var(--fg-faint)}

h1 small{display:block;font-size:12px;color:var(--fg-dim);letter-spacing:.04em;font-weight:normal}
.hbtns{display:flex;gap:8px}
a.back{color:var(--fg);text-decoration:none;border:1px solid var(--fg-dim);padding:0 12px;min-height:48px;display:inline-flex;align-items:center;font-size:14px;white-space:nowrap}
button{font:inherit;font-size:16px;min-height:48px;min-width:48px;cursor:pointer;background:#000;color:var(--fg);border:1px solid var(--fg);padding:10px 12px;letter-spacing:.05em}
button:active{background:var(--fg);color:#000}
button:disabled{opacity:.5;cursor:default}
button.big{width:100%;font-size:18px;font-weight:bold}
button.solid{background:var(--fg);color:#000;font-weight:bold}
button.warn{border-color:var(--red);color:var(--red)}
button.ghost{border-color:var(--fg-dim);color:var(--fg-dim)}
button.on{background:var(--fg);color:#000;font-weight:bold}
.panel{background:var(--panel);border:1px solid var(--fg-faint);padding:12px;margin:10px 0}
.lbl{display:block;color:var(--amber);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;margin:0 0 .4rem}
input.in,select.in{width:100%;min-width:0;height:3.25rem;padding:0 .85rem;background:#000;color:var(--white);border:2px solid var(--fg-dim);border-radius:3px;
font-family:var(--font);font-size:1.15rem;font-variant-numeric:tabular-nums;color-scheme:dark;-webkit-appearance:none;appearance:none}
input.in:focus,select.in:focus{outline:none;border-color:var(--fg);box-shadow:0 0 10px rgba(57,255,106,.35)}
input.in::placeholder{color:rgba(57,255,106,.35)}
input.in[type=date]{font-size:1rem;padding:0 .4rem}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.75rem}
.field{margin-bottom:.9rem;min-width:0}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.chips button{padding:4px 0;font-size:15px;letter-spacing:0}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:.9rem}
.quick button{padding:4px 0;font-size:14px;letter-spacing:0}
details.filters>summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between;color:var(--white);letter-spacing:.08em;font-weight:bold}
details.filters>summary::-webkit-details-marker{display:none}
details.filters>summary span{color:var(--fg-dim);font-weight:normal;font-size:13px;text-align:right}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--fg-faint);background:var(--panel);padding:10px;min-width:0}
.stat i{display:block;font-style:normal;color:var(--amber);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.stat b{display:block;color:var(--fg);font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(57,255,106,.35);overflow-wrap:anywhere}
.stat small{display:block;color:var(--fg-dim);font-size:12px;margin-top:2px}
.stat.wide{grid-column:1/-1}
.meter{height:10px;border:1px solid var(--fg-dim);margin-top:6px;background:#000}
.meter span{display:block;height:100%;background:var(--fg)}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:10px 0}
.logcard{display:block;width:100%;text-align:left;border:1px solid var(--fg-faint);background:var(--panel);padding:12px;margin:8px 0;color:var(--white);letter-spacing:0;min-height:72px}
.logcard:active{background:#0c240c;color:var(--white)}
.lc1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lc1 b{font-size:18px;color:var(--white)}
.lc1 span{color:var(--fg-dim);font-size:13px;white-space:nowrap}
.lc2{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{border:1px solid var(--fg-dim);color:var(--fg);font-size:13px;padding:2px 6px}
.lc3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lc3 div{min-width:0}
.lc3 i{display:block;font-style:normal;color:var(--fg-dim);font-size:12px}
.lc3 b{font-size:17px;color:var(--white);font-variant-numeric:tabular-nums}
.badge{font-weight:bold;font-size:13px;padding:3px 7px;letter-spacing:.06em;white-space:nowrap}
.badge.met{background:var(--fg);color:#000}

.msg{padding:10px 12px;border:1px solid var(--amber);color:var(--amber);margin:10px 0}
.msg.bad{border-color:var(--red);color:var(--red)}
.lock{margin-top:40px}
.lock p{color:var(--fg-dim);line-height:1.45}
.overlay{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;padding:0 14px calc(30px + env(safe-area-inset-bottom))}
.overlay[hidden]{display:none}
.ovtop{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--fg-faint);z-index:1}

.svline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--fg-faint);flex-wrap:wrap}
.svline span{color:var(--fg-dim);font-size:15px}
.svline b{color:var(--white);font-size:20px;text-align:right;overflow-wrap:anywhere}
.svline.big b{font-size:28px;color:var(--fg)}
h3{color:var(--amber);font-size:13px;letter-spacing:.12em;margin:20px 0 6px;text-transform:uppercase}
h3.bad{color:var(--red)}
.svrow{border:1px solid var(--fg-faint);padding:8px;margin:8px 0}
.cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cells div{min-width:0;overflow-wrap:anywhere}
.cells i{display:block;font-style:normal;color:var(--fg-dim);font-size:12px}
.cells b{color:var(--white);font-size:17px}
ul.list{padding-left:22px;color:var(--white);line-height:1.45;font-size:17px;margin:4px 0}
.timeline{display:flex;height:34px;border:1px solid var(--fg-dim);margin:6px 0 2px}
.timeline span{display:flex;align-items:center;justify-content:center;font-size:12px;color:#000;background:var(--fg);border-right:2px solid var(--bg);overflow:hidden;white-space:nowrap}
.timeline span:nth-child(2n){background:var(--amber)}
.timeline span:last-child{border-right:0}
.confirm{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.confirm[hidden]{display:none}
.confirm .box{background:var(--bg);border:1px solid var(--red);border-bottom:0;width:100%;max-width:640px;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
.confirm .box b{color:var(--red);font-size:18px;display:block;margin-bottom:8px}
.confirm .box p{color:var(--white);line-height:1.45;margin:0 0 14px}
.confirm .btns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:#000;padding:12px 16px;font-weight:bold;display:none;max-width:90vw;z-index:50}
body.noscroll{overflow:hidden}
.more{margin:12px 0}
/* tabs + analyze */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 0}
.tabs[hidden]{display:none}
.subtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}
.subtabs button{font-size:14px;padding:6px 2px;letter-spacing:.04em}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-size:13px;padding:6px 10px;min-height:44px;letter-spacing:.03em;flex:1 1 auto}
.seg.two button{flex:1 1 40%}
.seg+.seg{margin-top:8px}
.seghdr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchips button{font-size:14px;padding:4px 10px;min-height:44px;min-width:44px;letter-spacing:0}
.lbl em{font-style:normal;text-transform:none;letter-spacing:0;font-size:12px}
.chartbox{margin-top:12px;min-height:60px;overflow:hidden}
svg.chart{display:block;max-width:100%}
svg.chart .grid{stroke:rgba(57,255,106,.14);stroke-width:1}
svg.chart .ax{fill:#1f9a3e;font:11px "Courier New",Courier,monospace}
svg.chart .bl{fill:#eaffea;font:13px "Courier New",Courier,monospace}
svg.chart .bv{fill:#39ff6a;font:bold 13px "Courier New",Courier,monospace}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--white)}
.legend i,i.sw{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
.legend i.dash{height:0;border-top:2px dashed var(--fg-dim);width:16px;vertical-align:3px}
.legend i.dot{height:0;border-top:2px dotted var(--white);width:16px;vertical-align:3px}
.legend .off,tr.off{opacity:.4;text-decoration:line-through}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--fg-faint);margin:8px 0}
table.tbl{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 8px;border-bottom:1px solid var(--fg-faint);text-align:right;white-space:nowrap;color:var(--white)}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);max-width:42vw;overflow:hidden;text-overflow:ellipsis}
.tbl th{color:var(--amber);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:normal}
.tbl th button{all:unset;cursor:pointer;min-height:36px;display:inline-flex;align-items:center}
.tbl tr.tot td{color:var(--fg);font-weight:bold;border-top:2px solid var(--fg-dim)}
details.info{position:relative}
details.info>summary{list-style:none;cursor:pointer;color:var(--amber);font-size:20px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
details.info>summary::-webkit-details-marker{display:none}
details.info p{position:absolute;right:0;top:44px;z-index:5;width:min(320px,86vw);background:#000;border:1px solid var(--amber);color:var(--white);font-size:13px;line-height:1.45;padding:10px;margin:0}
details.series>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:48px}
details.series>summary::-webkit-details-marker{display:none}
details.series .sw{width:16px;height:32px;flex:0 0 16px;margin:0}
.sname{flex:1;min-width:0}
.sname b{display:block;color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sname small{display:block;color:var(--fg-dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbtns button{font-size:13px;min-height:44px;padding:4px 10px}
.sbody{margin-top:12px}
input.in.color{padding:4px;height:3.25rem}
/* throughput factors + coil details */
.thin{display:inline-block;margin-left:6px;padding:1px 5px;border:1px solid var(--amber);color:var(--amber);font-size:11px;letter-spacing:.04em;font-weight:normal;vertical-align:1px}
.tbl tr.thinrow td{color:#b9c9b9}
.tbl tr.sub td{color:var(--fg-dim);font-size:13px}
.tbl.fac td:first-child{max-width:55vw}
.facl li{line-height:1.45}
.daynotes{white-space:pre-wrap;color:var(--white);font-size:16px;line-height:1.45;background:#000;border:1px solid var(--fg-faint);padding:10px 12px;margin:4px 0}
.cells .wide{grid-column:1/-1}
.lc3.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.lc3.four b{font-size:16px}
/* revisit / edit a log */
.edrow{border:1px solid var(--fg-faint);padding:10px;margin:8px 0;background:var(--panel)}
.edrow .row2{margin-bottom:0}
.edrow .field{margin-bottom:.6rem}
.edrow .rm{width:100%;min-height:44px;font-size:14px}
.edhead{display:flex;justify-content:space-between;align-items:center;color:var(--amber);font-size:13px;letter-spacing:.08em;margin-bottom:6px}
textarea.in{width:100%;min-height:5rem;padding:.6rem .85rem;background:#000;color:var(--white);border:2px solid var(--fg-dim);border-radius:3px;font-family:var(--font);font-size:1rem;resize:vertical}
.edtot{border:2px solid var(--fg-dim);padding:10px;margin:10px 0;color:var(--white)}
.edtot b{color:var(--fg);font-size:20px}
.diffl{margin:0 0 14px;padding-left:20px;color:var(--white);line-height:1.45;max-height:45vh;overflow-y:auto}
.edited{border:1px solid var(--amber);color:var(--amber);padding:8px 10px;margin:10px 0;font-size:14px}
</style>

<body>
<header>
  <h1>MASTER LOG<small>every submitted production log</small></h1>
  <div class="hbtns"><button id="lockbtn" type="button" class="ghost" hidden>LOCK</button><a class="back" href="/draw/app/">&larr; TRACKER</a></div>
</header>
<nav class="tabs" id="tabs" hidden><button type="button" data-v="logs">LOGS</button><button type="button" data-v="analyze">ANALYZE</button></nav>
<main id="app"></main>
<div class="overlay" id="detail" hidden role="dialog" aria-label="Log detail"><div class="ovtop"><b id="dtitle">LOG</b><button id="dclose" type="button">CLOSE</button></div><div id="dbody"></div></div>
<div class="confirm" id="confirm" hidden role="alertdialog" aria-label="Confirm"><div class="box"><b id="ctitle">DELETE THIS LOG?</b><p id="cmsg"></p><ul class="diffl" id="clist" hidden></ul>
  <div class="btns"><button id="cno" type="button" class="big">CANCEL</button><button id="cyes" type="button" class="big warn">DELETE</button></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script src="analyze.js?v=2"></script>
<script>
(function () {
  "use strict";
  var API = String(window.LOGDB_API_BASE || "").replace(/\/+$/, "");
  var SKEY = "logdbAdminCode";          // sessionStorage only: gone when the tab closes
  var PAGE = 100;
  var VKEY = "logdbView", view = (function () { try { return sessionStorage.getItem(VKEY) || (/[#&]cmp=/.test(location.hash) ? "analyze" : "logs"); } catch (e) { return "logs"; } })();
  if (/[#&]cmp=/.test(location.hash)) view = "analyze";
  var F = { from: "", to: "", operator: "", draw: "" }, logs = [], summary = null, operators = [], hasMore = false, current = null;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function code() { try { return sessionStorage.getItem(SKEY) || ""; } catch (e) { return ""; } }
  function setCode(v) { try { if (v) sessionStorage.setItem(SKEY, v); else sessionStorage.removeItem(SKEY); } catch (e) {} }
  function toast(m) { var t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = "none"; }, 2200); }
  function n0(v) { return v === null || v === undefined || v === "" ? "\u2013" : Math.round(v).toLocaleString("en-US"); }
  function n1(v) { return v === null || v === undefined || v === "" ? "\u2013" : (Math.round(v * 10) / 10).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
  function nh(v) { return v === null || v === undefined ? "\u2013" : String(Math.round(v * 100) / 100); }
  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  function day(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); if (!m) return s || ""; var d = new Date(+m[1], +m[2] - 1, +m[3]); return DOW[d.getDay()] + " " + (+m[2]) + "/" + (+m[3]) + "/" + m[1].slice(2); }
  function clock12(s) { var m = /^(\d{2}):(\d{2})$/.exec(s || ""); if (!m) return s || ""; var h = +m[1]; return ((h + 11) % 12 + 1) + ":" + m[2] + (h < 12 ? " AM" : " PM"); }
  function ymd(d) { return d.getFullYear() + "-" + (d.getMonth() < 9 ? "0" : "") + (d.getMonth() + 1) + "-" + (d.getDate() < 10 ? "0" : "") + d.getDate(); }
  function draws(s) { return String(s || "").split(",").filter(Boolean); }
  function badge(g) { return g === 1 ? '<span class="badge met">GOAL MET</span>' : g === 0 ? '<span class="badge notmet">NOT MET</span>' : '<span class="badge inc">NO GOAL</span>'; }

  function api(path, opts) {
    opts = opts || {};
    var h = { "X-Admin-Code": code() };
    return fetch(API + path, { method: opts.method || "GET", headers: h, cache: "no-store", credentials: "omit" }).then(function (r) {
      if (r.status === 401) { setCode(""); renderLock("Wrong passcode."); throw new Error("401"); }
      if (opts.raw && r.ok) return r;
      return r.json().catch(function () { return { ok: false, error: "Server said " + r.status }; }).then(function (j) {
        if (!r.ok || !j.ok) throw new Error(j.error || ("Server said " + r.status));
        return j;
      });
    });
  }
  function qs(extra) {
    var p = []; Object.keys(F).forEach(function (k) { if (F[k]) p.push(k + "=" + encodeURIComponent(F[k])); });
    Object.keys(extra || {}).forEach(function (k) { p.push(k + "=" + encodeURIComponent(extra[k])); });
    return p.length ? "?" + p.join("&") : "";
  }

  /* ---------- lock screen ---------- */
  function setTabs() {
    $("tabs").hidden = false;
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) { b.className = b.dataset.v === view ? "on" : ""; });
  }
  function start() {
    try { sessionStorage.setItem(VKEY, view); } catch (e) {}
    if (view === "analyze" && window.Analyze) {
      setTabs(); $("lockbtn").hidden = false;
      window.Analyze.show($("app"), { api: api, esc: esc, day: day, n0: n0, n1: n1, toast: toast });
    } else { view = "logs"; load(false); }
  }
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
    b.onclick = function () { if (view === b.dataset.v) return; view = b.dataset.v; closeDetail(); start(); };
  });
  function renderLock(err) {
    $("lockbtn").hidden = true; $("tabs").hidden = true; if (window.Analyze) window.Analyze.reset();
    $("app").innerHTML = '<div class="lock"><form id="lockform" class="panel" autocomplete="off">' +
      '<div class="field"><label class="lbl" for="pass">Passcode</label><input class="in" id="pass" type="password" placeholder="passcode" autocomplete="current-password" required></div>' +
      (err ? '<div class="msg bad" role="alert">' + esc(err) + '</div>' : "") +
      '<button class="big solid" type="submit">UNLOCK</button></form>' +
      '<p>Only people with the passcode can see logs. It is kept for this tab only and forgotten when you close it.</p></div>';
    $("lockform").onsubmit = function (e) {
      e.preventDefault(); var v = $("pass").value.trim(); if (!v) return;
      setCode(v); start();
    };
    setTimeout(function () { var p = $("pass"); if (p) p.focus(); }, 0);
  }

  /* ---------- list ---------- */
  function load(append) {

    bind("ed-prob", function (v) { d.problems = v; }); bind("ed-notes", function (v) { d.notes = v; }); bind("ed-maint", function (v) { d.maintenance = v; });
    bind("ed-crew", function (v) { d.crew = v; });
    var retotal = function () { if (d.totalTouched) return; d.total = Math.round(sumCoils(d) * 10) / 10; if ($("ed-total")) $("ed-total").value = d.total; };
    d.coils.forEach(function (c, i) {
      bind("ed-cw-" + i, function (v) { c.weight = v; c.changedW = true; retotal(); }); bind("ed-cm-" + i, function (v) { c.machine = v; });
      bind("ed-cp-" + i, function (v) { c.part = v; }); bind("ed-cf-" + i, function (v) { c.finish = v; }); bind("ed-cn-" + i, function (v) { c.note = v; });
    });
    d.downtime.forEach(function (x, i) { bind("ed-dm-" + i, function (v) { x.machine = v; }); bind("ed-dn-" + i, function (v) { x.minutes = v; }); bind("ed-dr-" + i, function (v) { x.reason = v; }); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-rmc]"), function (b) { b.onclick = function () { d.coils.splice(+b.getAttribute("data-rmc"), 1); retotal(); renderEdit(); }; });
    Array.prototype.forEach.call(document.querySelectorAll("[data-rmd]"), function (b) { b.onclick = function () { d.downtime.splice(+b.getAttribute("data-rmd"), 1); renderEdit(); }; });
    $("ed-addc").onclick = function () { var last = d.coils[d.coils.length - 1]; d.coils.push({ orig: null, weight: "", machine: last ? last.machine : "", part: last ? last.part : "", finish: last ? last.finish : "", note: "" }); renderEdit(); var w = $("ed-cw-" + (d.coils.length - 1)); if (w) { w.scrollIntoView({ block: "center" }); w.focus(); } };
    $("ed-addd").onclick = function () { d.downtime.push({ orig: null, machine: "", minutes: "", reason: "" }); renderEdit(); };
    $("ed-cancel").onclick = leaveEdit;
    $("ed-save").onclick = reviewEdit;
  }
  function leaveEdit() { editing = null; if (lastDetail) { $("dtitle").textContent = (lastDetail.log.operator + " \u00b7 " + day(lastDetail.log.shift_date)).toUpperCase(); renderDetail(lastDetail); } }
  function edErr(m) { $("ed-err").innerHTML = m ? '<div class="msg bad" role="alert">' + esc(m) + '</div>' : ""; if (m) $("ed-err").scrollIntoView({ block: "center" }); }
  var NUM_RE = /^\s*\d+(?:\.\d+)?\s*$/;
  function buildEdit() {
    var e = editing, d = e.d, j = e.j, L = j.log, raw = JSON.parse(JSON.stringify(j.raw || {})), ch = [];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date)) return { err: "Pick the shift date." };
    if (!d.operator.trim()) return { err: "Type the operator\u2019s name." };
    var coils = [];
    for (var i = 0; i < d.coils.length; i++) {
      var c = d.coils[i], w = String(c.weight).replace(/,/g, "").trim();
      if (w !== "" && (!NUM_RE.test(w) || !(+w > 0) || +w > 100000)) return { err: "Coil " + (i + 1) + ": the weight must be a number from 1 to 100,000 lb." };
      if (w === "" && !c.orig) return { err: "Coil " + (i + 1) + ": type its weight, or remove it." };
      var o = c.orig ? JSON.parse(JSON.stringify(c.orig)) : {};
      var oldW = c.orig ? c.orig.weight : null;
      o.weight = w === "" ? (oldW != null ? oldW : null) : +w;
      // one coil per row (the tracker's rows): its avg weight is its weight
      if (w !== "" && (!c.orig || c.orig.coils_in === 1 || c.orig.avg_wgt === oldW)) { o.avg_wgt = +w; if (!c.orig) o.coils_in = 1; }
      if ((c.orig ? c.orig.machine || "" : "") !== c.machine.trim()) { o.machine = c.machine.trim(); delete o.draw; }
      o.part = c.part.trim(); o.finish = c.finish.trim(); o.note = c.note.trim();
      if (c.orig && c.orig.weight === null && o.weight === null) delete o.weight;
      Object.keys(o).forEach(function (k) { if (o[k] === null || o[k] === undefined) delete o[k]; });
      if (!c.orig) ch.push("Added coil " + (i + 1) + ": " + n1(o.weight) + " lb" + (o.machine ? " on " + o.machine : ""));
      else {
        if (oldW !== o.weight && !(oldW == null && o.weight == null)) ch.push("Coil " + (i + 1) + " weight: " + n1(oldW) + " \u2192 " + n1(o.weight) + " lb");
        [["machine", "machine"], ["part", "part #"], ["finish", "finish size"], ["note", "note"]].forEach(function (f) {
          if ((c.orig[f[0]] || "") !== (o[f[0]] || "")) ch.push("Coil " + (i + 1) + " " + f[1] + ": " + (c.orig[f[0]] || "blank") + " \u2192 " + (o[f[0]] || "blank"));
        });
      }
      coils.push(o);
    }
    var origCoils = Array.isArray(raw.coils) ? raw.coils.length : j.coils.length;
    var removedC = origCoils - d.coils.filter(function (c) { return c.orig; }).length;
    if (removedC > 0) ch.push("Removed " + removedC + " coil" + (removedC === 1 ? "" : "s"));
    if (!coils.length && !(trackerOf(j) && d.downtime.length)) return { err: "A log needs at least one coil." };
    var dts = [];
    for (var k = 0; k < d.downtime.length; k++) {
      var x = d.downtime[k], m = String(x.minutes).trim();
      if (!NUM_RE.test(m) || +m > 1440) return { err: "Downtime " + (k + 1) + ": minutes must be a number from 0 to 1,440." };
      var od = x.orig ? JSON.parse(JSON.stringify(x.orig)) : {};
      if ((x.orig ? x.orig.machine || "" : "") !== x.machine.trim()) { od.machine = x.machine.trim(); delete od.draw; }
      od.minutes = +m; od.reason = x.reason.trim();
      Object.keys(od).forEach(function (q) { if (od[q] === null || od[q] === undefined) delete od[q]; });
      if (!x.orig) ch.push("Added downtime: " + n0(od.minutes) + " min" + (od.reason ? ", " + od.reason : ""));
      else if (+x.orig.minutes !== od.minutes || (x.orig.reason || "") !== od.reason || (x.orig.machine || "") !== (od.machine || "")) ch.push("Downtime " + (k + 1) + ": " + n0(x.orig.minutes) + " min" + (x.orig.reason ? ", " + x.orig.reason : "") + " \u2192 " + n0(od.minutes) + " min" + (od.reason ? ", " + od.reason : ""));
      dts.push(od);
    }
    var origD = Array.isArray(raw.downtime) ? raw.downtime.length : j.downtime.length, removedD = origD - d.downtime.filter(function (x) { return x.orig; }).length;
    if (removedD > 0) ch.push("Removed " + removedD + " downtime entr" + (removedD === 1 ? "y" : "ies"));
    var tot = String(d.total).replace(/,/g, "").trim(), net = String(d.net).trim();
    if (!NUM_RE.test(tot)) return { err: "Total lbs must be a number." };
    if (net !== "" && (!NUM_RE.test(net) || +net > 24)) return { err: "Net run hours must be a number from 0 to 24." };
    tot = Math.round(+tot * 10) / 10; net = net === "" ? null : +net;
    var t = Object.assign({}, raw.totals || {}), oldNet = L.net_hours;
    if (L.total_lbs !== tot) ch.push("Total lbs: " + n0(L.total_lbs) + " \u2192 " + n0(tot));
    if (oldNet !== net) {
      ch.push("Net run hours: " + nh(oldNet) + " \u2192 " + nh(net));
      if (t.goal_lbs > 0 && oldNet > 0 && net > 0) t.goal_lbs = Math.round(t.goal_lbs * net / oldNet);   // same need rate over the new hours
    }
    t.total_lbs = tot; t.net_hours = net; t.avg_lbhr = net > 0 ? Math.round(tot / net * 10) / 10 : null;
    t.goal_met = t.goal_lbs > 0 ? tot >= t.goal_lbs : (L.goal_met === 1 ? true : L.goal_met === 0 ? false : null);
    var sh = Object.assign({}, raw.shift || {});
    [["date", "Shift date", L.shift_date], ["start", "Start", L.shift_start], ["end", "End", L.shift_end], ["operator", "Operator", L.operator]].forEach(function (f) {
      var nv = f[0] === "operator" ? d.operator.trim() : d[f[0]];
      if ((f[2] || "") !== nv) ch.push(f[1] + ": " + ((f[0] === "start" || f[0] === "end") ? clock12(f[2]) || "blank" : f[2] || "blank") + " \u2192 " + ((f[0] === "start" || f[0] === "end") ? clock12(nv) || "blank" : nv || "blank"));
      sh[f[0]] = nv;
    });
    if ((L.problems || "") !== d.problems.trim()) ch.push("Problems / downtime notes changed");
    if ((L.day_notes || "") !== d.notes.trim()) ch.push("Notes about the day changed");
    if ((L.maintenance || "") !== d.maintenance.trim()) ch.push("Maintenance changed");
    var base = L.id.replace(/-v\d+$/, ""), vm = /-v(\d+)$/.exec(L.id), v = vm ? +vm[1] : 1;
    if (!/^[A-Za-z0-9_-]{6,58}$/.test(base)) return { err: "This log\u2019s id can\u2019t take an edit. Delete it and have it sent again instead." };
    // supervisor versions start at v101, so a later re-send from the operator's phone (v2, v3...) can't quietly overwrite the fix
    var nid = base + "-v" + (v < 100 ? 101 : v + 1);
    var body = Object.assign(raw, { id: nid, replaces: L.id, force: true, shift: sh, coils: coils, downtime: dts, totals: t,
      problems: d.problems.trim(), maintenance: d.maintenance.trim(), day_notes: d.notes.trim(),
      edited: { by: "supervisor", at: new Date().toISOString(), from: L.id, changes: ch.slice(0, 60) } });
    return { body: body, changes: ch };
  }
  function reviewEdit() {
    var r = buildEdit();
    if (r.err) { edErr(r.err); return; }
    edErr("");
    if (!r.changes.length) { edErr("Nothing changed yet."); return; }
    if (!editing.d.crew.trim()) { edErr("Type the crew code to save."); $("ed-crew").focus(); return; }
    $("ctitle").textContent = "SAVE THESE CHANGES?"; $("cmsg").textContent = "The fixed log replaces the one in the master log:";
    var ul = $("clist"); ul.innerHTML = r.changes.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join(""); ul.hidden = false;
    $("cyes").textContent = "SAVE"; $("cyes").className = "big solid"; $("cno").textContent = "GO BACK";
    $("confirm").hidden = false; $("cno").focus();
    $("cno").onclick = function () { $("confirm").hidden = true; $("cno").textContent = "CANCEL"; };
    $("cyes").onclick = function () {
      $("cyes").disabled = true;
      fetch(API + "/submit", { method: "POST", headers: { "Content-Type": "application/json", "X-Crew-Code": editing.d.crew.trim() },
        body: JSON.stringify(r.body), credentials: "omit", cache: "no-store" })
        .then(function (res) { return res.json().catch(function () { return {}; }).then(function (j) { return { res: res, j: j }; }); })
        .then(function (x) {
          $("confirm").hidden = true; $("cno").textContent = "CANCEL";
          if (x.res.ok && x.j.ok) {
            editing = null; toast("Saved. The fixed log is in the master log."); coilQs = null;
            load(false); openDetail({ id: r.body.id, operator: r.body.shift.operator, shift_date: r.body.shift.date });
          } else if (x.res.status === 401) edErr("The crew code is wrong. Nothing was saved.");
          else edErr("Not saved: " + (x.j.error || "server said " + x.res.status) + (x.j.field ? " (" + x.j.field + ")" : ""));
        }).catch(function () { $("confirm").hidden = true; $("cno").textContent = "CANCEL"; edErr("Not saved: no connection to the database. Try again."); })
        .then(function () { $("cyes").disabled = false; });
    };
  }

  /* ---------- Android Back: closes the top dialog, then the edit form, then the log; never leaves the page by surprise ---------- */
  var guardOn = false, popSkip = false;
  function armGuard() { if (guardOn) return; try { history.pushState({ logGuard: 1 }, ""); guardOn = true; } catch (e) {} }
  function dropGuard() { if (!guardOn) return; guardOn = false; popSkip = true; try { history.back(); } catch (e) { popSkip = false; } }
  window.addEventListener("popstate", function () {
    if (popSkip) { popSkip = false; return; }
    guardOn = false;
    if (!$("confirm").hidden) { $("confirm").hidden = true; $("cno").textContent = "CANCEL"; armGuard(); return; }
    if (editing) { leaveEdit(); armGuard(); return; }
    if (!$("detail").hidden) { $("detail").hidden = true; document.body.classList.remove("noscroll"); }
  });

  $("dclose").onclick = function () { if (editing) leaveEdit(); else closeDetail(); };
  $("lockbtn").onclick = function () { setCode(""); closeDetail(); renderLock(""); };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if (!$("confirm").hidden) { $("confirm").hidden = true; $("cno").textContent = "CANCEL"; } else if (editing) leaveEdit(); else if (!$("detail").hidden) closeDetail(); } });
  if (code()) start(); else renderLock("");
})();
</script>
