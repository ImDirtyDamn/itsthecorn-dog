<!DOCTYPE html>
<!--
  PRODUCTION LOG CALCULATOR, TRYOUT  (Daily Draw Operator Production Report, P-310)
  A one-thing-per-screen redesign of /calc/. Self-contained, no outside files.
  Saves the shift in progress to localStorage key "drawCalcTryV1" (nothing is remembered once you start a new shift).
  Reads the tracker (drawRateV5) only when you tap FILL FROM TODAY'S TRACKER, and never changes it.
  The math lives in the "calc-core" script below: a line-for-line port of production_calc.py (parity tested).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030a03">
<meta name="robots" content="noindex">
<title>Production Log (tryout)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23030a03'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%2339ff6a' font-family='monospace'%3E%3D%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#030a03;--panel:#061206;--fg:#39ff6a;--fg-dim:#1f9a3e;--fg-faint:rgba(57,255,106,.16);--amber:#ffc23d;--red:#ff5f56;--white:#eaffea;--ph:#5f7a63;
--font:"Courier New",Courier,"Noto Sans Mono","DejaVu Sans Mono","Droid Sans Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;-webkit-text-size-adjust:100%}
body{padding:0 12px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;overflow-x:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 10px;border-bottom:1px solid var(--fg-faint)}
h1{font-size:17px;margin:0;letter-spacing:.06em;color:var(--white);text-shadow:0 0 8px rgba(57,255,106,.4)}
h1 small{display:block;font-size:12px;color:var(--fg-dim);letter-spacing:.04em;font-weight:normal}
a.back{color:var(--fg);text-decoration:none;border:1px solid var(--fg-dim);padding:0 12px;min-height:48px;display:inline-flex;align-items:center;font-size:14px;white-space:nowrap}
h2{font-size:15px;letter-spacing:.1em;color:var(--white);margin:18px 0 6px;text-transform:uppercase}
.panel{background:var(--panel);border:1px solid var(--fg-faint);padding:12px;margin:10px 0}
label,.lbl{display:block;font-size:13px;color:var(--fg-dim);margin:0 0 4px;letter-spacing:.04em}
input,select,textarea{width:100%;min-height:48px;font:inherit;font-size:18px;background:#000;color:var(--white);border:1px solid var(--fg-dim);padding:8px 10px;border-radius:0}
textarea{font-size:16px;min-height:90px}
input::placeholder,textarea::placeholder{color:var(--ph);opacity:1;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--fg);border-color:var(--fg)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.f{min-width:0;margin-bottom:10px}
button{font:inherit;font-size:16px;min-height:48px;min-width:48px;cursor:pointer;background:#000;color:var(--fg);border:1px solid var(--fg);padding:10px 12px;letter-spacing:.05em}
button:active{background:var(--fg);color:#000}
button.big{width:100%;font-size:18px;font-weight:bold}
button.solid{background:var(--fg);color:#000;font-weight:bold}
button.warn{border-color:var(--red);color:var(--red)}
button.amber{border-color:var(--amber);color:var(--amber)}
button.ghost{border-color:var(--fg-dim);color:var(--fg-dim)}
button.on{background:var(--fg);color:#000;font-weight:bold}
.home{display:grid;gap:16px;margin-top:22px}
.home button{min-height:120px;font-size:22px;font-weight:bold;text-align:left;padding:16px;line-height:1.25}

.home button:active small{color:#000}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.steps button{padding:4px 2px;font-size:13px;letter-spacing:0;border-color:var(--fg-faint);color:var(--fg-dim);line-height:1.15}
.steps button.cur{border-color:var(--fg);color:var(--white);font-weight:bold;box-shadow:inset 0 -4px 0 var(--fg)}
.steps button.done{color:var(--fg)}
.navbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--fg-faint);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:10}
.navbar .in{max-width:616px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px}
.navbar button{min-height:56px;font-size:18px;font-weight:bold}
.card{border:1px solid var(--fg-faint);background:var(--panel);padding:12px;margin:10px 0}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.cardhead b{color:var(--white);letter-spacing:.06em}
.xbtn{border-color:var(--red);color:var(--red);padding:0;width:48px;font-size:20px}
.cuts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 10px}
.cuts button{padding:6px 2px;font-size:15px;letter-spacing:0}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:0 0 10px}
.chips button{padding:0;font-size:18px;letter-spacing:0}
.chips button.wide{grid-column:span 5;font-size:16px}
.live{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px dashed var(--fg-faint);padding:8px 0 0;flex-wrap:wrap}
.live span{color:var(--fg-dim);font-size:13px}
.live b{color:var(--white);font-size:20px}
.muted{color:var(--fg-dim);font-size:14px;line-height:1.4}
.hint{display:block;font-size:12px;color:var(--amber);margin-top:3px}
details>summary{min-height:48px;display:flex;align-items:center;cursor:pointer;color:var(--fg-dim);letter-spacing:.05em}
.num{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--fg-faint);background:var(--panel);padding:12px;margin:8px 0;min-height:72px;letter-spacing:0}
.num span{color:var(--fg-dim);font-size:14px;line-height:1.3}
.num span i{display:block;font-style:normal;font-size:12px;color:var(--ph)}
.num b{color:var(--white);font-size:28px;white-space:nowrap}
.num.key b{font-size:34px;color:var(--fg);text-shadow:0 0 10px rgba(57,255,106,.5)}
.num:active{background:var(--fg-faint);color:var(--fg)}
.banner{display:block;width:100%;text-align:left;margin:12px 0;padding:14px 12px;border:2px solid var(--fg);font-weight:bold;font-size:20px;color:var(--fg);background:#000;letter-spacing:.03em}
.banner small{display:block;font-weight:normal;font-size:14px;margin-top:4px;color:var(--white)}
.banner.notmet{border-color:var(--red);color:var(--red)}
.banner.incomplete{border-color:var(--amber);color:var(--amber)}
.warnbox{color:var(--amber);font-size:15px;line-height:1.4;padding-left:20px;margin:6px 0}
.slot{border:1px solid var(--fg-dim);padding:12px;margin:12px 0;background:var(--panel)}
.slot>b{display:block;color:var(--white);letter-spacing:.06em;margin-bottom:8px}
.seg{border-top:1px dashed var(--fg-faint);padding-top:10px;margin-top:10px}
.runchoice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 10px}
.runchoice button{padding:4px 2px;font-size:15px;letter-spacing:0}
.tl{display:flex;min-height:52px;border:1px solid var(--fg-dim);margin:6px 0 2px;background:#000}
.tl button{min-width:0;flex:1 1 0;white-space:normal;line-height:1.1;border:0;border-right:2px solid var(--bg);padding:0 4px;font-size:14px;letter-spacing:0;overflow:hidden;background:var(--fg-faint);color:var(--white)}
.tl button.alt{background:rgba(255,194,61,.22)}
.tl button.gap{background:transparent;color:var(--ph)}
.tlx{display:flex;justify-content:space-between;color:var(--fg-dim);font-size:12px;margin-bottom:8px}
.movebox{border:1px dashed var(--amber);padding:10px;margin:10px 0}
.count{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.count button{min-height:72px;font-size:22px;font-weight:bold}
.drow{border:1px dashed var(--fg-faint);padding:10px;margin:0 0 10px}

.sheet{background:var(--bg);border:1px solid var(--fg);border-bottom:0;width:100%;max-width:640px;max-height:85vh;overflow-y:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.sheet .top b{color:var(--white);font-size:17px}
.sheet .big{font-size:34px;color:var(--fg);margin:4px 0 8px;text-shadow:0 0 10px rgba(57,255,106,.5)}
ol.math{padding-left:26px;margin:8px 0}
ol.math li{margin:0 0 12px;line-height:1.4;color:var(--white);font-size:17px;overflow-wrap:anywhere}
ol.math li.bad{color:var(--red);font-weight:bold}
ol.math li.good{color:var(--fg);font-weight:bold}
.sheetview{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;padding:0 14px calc(30px + env(safe-area-inset-bottom))}
.sheetview[hidden]{display:none}
.svtop{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--fg-faint)}
.svtop b{color:var(--white);font-size:16px}
.svline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--fg-faint);flex-wrap:wrap}
.svline span{color:var(--fg-dim);font-size:16px}
.svline b{color:var(--white);font-size:24px;text-align:right;overflow-wrap:anywhere}
.svline.big b{font-size:32px;color:var(--fg)}
.sheetview h3{color:var(--fg-dim);font-size:14px;letter-spacing:.1em;margin:18px 0 4px}
.sheetview h3.bad{color:var(--red)}
.svrow{border:1px solid var(--fg-faint);padding:8px;margin:8px 0}
.cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cells div{min-width:0;overflow-wrap:anywhere}
.cells i{display:block;font-style:normal;color:var(--fg-dim);font-size:12px}
.cells b{color:var(--white);font-size:18px}
.svlist{font-size:20px;color:var(--white);padding-left:24px;line-height:1.45}
.svp{font-size:20px;color:var(--white)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:#000;padding:12px 16px;font-weight:bold;display:none;max-width:90vw;z-index:40}
body.noscroll{overflow:hidden}
.trybadge{color:var(--amber);font-size:12px;letter-spacing:.08em}
/* clock-time inputs: copied from the tracker's setup screen (.in, .lbl, .field, .row2, .break-row, .sub) */
.field{margin-bottom:1.25rem;min-width:0}
.field>label{display:block;margin-bottom:.4rem}
label.lbl,.field .lbl{color:var(--amber);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase}
input.in{width:100%;min-width:0;height:3.25rem;min-height:0;padding:0 .85rem;background:#000;color:var(--white);border:2px solid var(--fg-dim);border-radius:3px;
font-family:var(--font);font-size:1.25rem;font-variant-numeric:tabular-nums;color-scheme:dark;-webkit-appearance:none;appearance:none}
input.in:focus{outline:none;border-color:var(--fg);box-shadow:0 0 10px rgba(57,255,106,.35)}
input.in::placeholder{color:rgba(57,255,106,.35);font-size:1.25rem}

.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.75rem}
.break-row{display:grid;grid-template-columns:minmax(0,1fr) 6rem 3.25rem;gap:.5rem;margin-bottom:.6rem;align-items:end}
.break-row .field{margin-bottom:0}
.break-row .btn{min-height:3.25rem;height:3.25rem;padding:0;border:2px solid var(--red);border-radius:3px;color:var(--red);font-weight:700;letter-spacing:.08em}
.field .sub,p.sub{color:var(--fg-dim);font-size:.85rem;margin:.4rem 0 0}
input.flash{outline:3px solid var(--amber)}
.help{color:var(--fg-dim);margin:0 0 1.5rem}
.calc-note{margin:.5rem 0 0;color:var(--amber);min-height:1.4em}
</style>

<body>
<header>
  <h1>PRODUCTION LOG<small>P-310 helper <span class="trybadge">TRYOUT</span></small></h1>
  <a class="back" href="../../">&larr; TRACKER</a>
</header>
<main id="app"></main>
<div class="navbar" id="navbar" hidden><div class="in"><button id="nav-back" type="button" class="ghost">&larr; BACK</button><button id="nav-next" type="button" class="solid">NEXT &rarr;</button></div></div>
<div class="overlay" id="drill" hidden role="dialog" aria-label="How we got it"><div class="sheet"><div class="top"><b id="drill-title"></b><button id="drill-close" type="button">CLOSE</button></div><div class="big" id="drill-big"></div><p class="muted" id="drill-sub">How we got it, step by step:</p><ol class="math" id="drill-steps"></ol></div></div>
<div class="sheetview" id="sheetview" hidden role="dialog" aria-label="Copy to sheet"><div class="svtop"><b>COPY ONTO THE P-310</b><button id="sv-close" type="button">CLOSE</button></div><div id="sv-body"></div></div>
<datalist id="reasons"><option value="die change"><option value="coil problem"><option value="wire break"><option value="waiting on coils"><option value="maintenance"><option value="meeting"><option value="power"></datalist>
<div class="toast" id="toast"></div>
<script id="calc-core">

/* ===== CALC CORE: line-for-line port of production_calc.py. Keep the two in sync. ===== */
var ProdCalc = (function () {
  var NUM_RE = /^-?(\d+\.?\d*|\.\d+)$/;
  function rhu(x) { return Math.floor(x + 0.5); }
  function fmtInt(n) {
    var neg = n < 0, s = String(Math.abs(n)), out = "";
    while (s.length > 3) { out = "," + s.slice(-3) + out; s = s.slice(0, -3); }
    return (neg ? "-" : "") + s + out;
  }
  function fmtTenths(t) {
    var sign = t < 0 ? "-" : "", a = Math.abs(t);
    return sign + fmtInt(Math.floor(a / 10)) + "." + String(a % 10);
  }
  function fmtNum(x) {
    var h = rhu(x * 100), sign = h < 0 ? "-" : "", a = Math.abs(h);
    var whole = Math.floor(a / 100), frac = a % 100;
    if (frac === 0) return sign + fmtInt(whole);
    var f = String(frac); while (f.length < 2) f = "0" + f; f = f.replace(/0+$/, "");
    return sign + fmtInt(whole) + "." + f;
  }
  function plural(n, one, many) { return n === 1 ? one : many; }
  function num(v) {
    if (v === null || v === undefined || typeof v === "boolean") return null;
    if (typeof v === "number") return isFinite(v) ? v : null;
    var s = String(v).trim().replace(/,/g, "");
    if (!NUM_RE.test(s)) return null;
    return parseFloat(s);
  }
  function computeRow(row, index) {
    var label = String(row.card || "").trim() || ("Row " + (index + 1));
    var woCoils = num(row.woCoils), woTotal = num(row.woTotal), avgIn = num(row.avgWgt);
    var drawn = num(row.coilsDrawn), half = !!row.halfCut;
    var outIn = num(row.coilsOut), coilsOut;
    if (outIn !== null && outIn > 0) coilsOut = outIn;
    else if (half && drawn !== null && drawn > 0) coilsOut = drawn * 2;
    else coilsOut = null;
    var cut = coilsOut !== null && drawn !== null && drawn > 0 && coilsOut !== drawn;
    var weighed = (row.actualWeights || []).map(num).filter(function (w) { return w !== null && w > 0; });
    var steps = [], warnings = [], avg = null, avgSource = "none";
    if (woCoils !== null && woTotal !== null && woCoils > 0 && woTotal > 0) {
      avg = rhu(woTotal / woCoils); avgSource = "workorder";
      steps.push("Card " + label + ": work order " + fmtInt(rhu(woTotal)) + " lb \u00f7 " + fmtNum(woCoils) + " " +
        plural(woCoils, "coil", "coils") + " = " + fmtInt(avg) + " lb avg per coil");
    } else if (avgIn !== null && avgIn > 0) {
      avg = rhu(avgIn); avgSource = "entered";
      steps.push("Card " + label + ": avg weight " + fmtInt(avg) + " lb per coil (typed in)");
    }
    var weight = null, weightSource = "none";
    if (weighed.length) {
      var parts = weighed.map(rhu);
      weight = parts.reduce(function (a, b) { return a + b; }, 0); weightSource = "weighed";
      if (parts.length === 1) steps.push("Card " + label + ": weighed coil = " + fmtInt(weight) + " lb");
      else steps.push("Card " + label + ": weighed coils " + parts.map(fmtInt).join(" + ") + " = " + fmtInt(weight) + " lb");
    } else if (avg !== null && drawn !== null && drawn > 0) {
      weight = rhu(avg * drawn); weightSource = "avg";
      if (cut) steps.push("Card " + label + ": you drew " + fmtNum(drawn) + " " + plural(drawn, "coil", "coils") + " (cut into " +
        fmtNum(coilsOut) + "). Weight counts the coils you drew: " + fmtInt(avg) + " lb \u00d7 " + fmtNum(drawn) + " = " + fmtInt(weight) + " lb");
      else steps.push("Card " + label + ": " + fmtInt(avg) + " lb \u00d7 " + fmtNum(drawn) + " " +
        plural(drawn, "coil", "coils") + " drawn = " + fmtInt(weight) + " lb");
    }
    var coilsText;
    if (drawn !== null && drawn > 0) coilsText = fmtNum(drawn) + (cut ? "=" + fmtNum(coilsOut) : "");
    else if (weighed.length) coilsText = fmtInt(weighed.length);
    else coilsText = "";
    if (woCoils !== null && drawn !== null && drawn > woCoils)
      warnings.push("Card " + label + ": " + fmtNum(drawn) + " coils drawn but the work order only has " + fmtNum(woCoils) + ". Check the numbers.");
    if (weight === null) {
      if (avg === null) warnings.push("Card " + label + ": needs the work order coils and Tot Avg Wgt (or an avg weight).");
      else warnings.push("Card " + label + ": how many coils did you draw?");
    }
    return { label: label, avg: avg, avgSource: avgSource, weight: weight, weightSource: weightSource,
      coilsOut: coilsOut, coilsText: coilsText, steps: steps, warnings: warnings };
  }
  function fmtHm(minutes) {
    var m = minutes, sign = m < 0 ? "-" : ""; m = Math.abs(m);
    var h = Math.floor(m / 60), r = m % 60;
    if (h === 0) return sign + r + " min";
    if (r === 0) return sign + h + " hr";
    return sign + h + " hr " + r + " min";
  }
  function mkey(name) { return (name === null || name === undefined ? "" : String(name)).trim().toLowerCase(); }
  function mname(m) { return (m.name === null || m.name === undefined ? "" : String(m.name)).trim(); }
  function findMachine(machines, name) {
    var k = mkey(name); if (k === "") return null;
    var list = machines || [];
    for (var i = 0; i < list.length; i++) if (mkey(list[i].name) === k) return list[i];
    return null;
  }
  function minutesList(items) {
    var out = [];
    (items || []).forEach(function (it) {
      var v = num(it !== null && typeof it === "object" && !Array.isArray(it) ? it.minutes : it);
      if (v !== null && v > 0) out.push(rhu(v));
    });
    return out;
  }
  function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
  function parseHm(s) {
    var t = (s === null || s === undefined ? "" : String(s)).trim();
    var m = /^(\d{1,2}):(\d{2})$/.exec(t);
    if (m) return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
    var v = num(t); if (v === null || v < 0) return null;
    return rhu(v * 60);
  }
  function findRun(runs, name) {
    var k = mkey(name), list = runs || [];
    for (var i = 0; i < list.length; i++) if (mkey(list[i].machine) === k) return list[i];
    return null;
  }
  function fmtHrs(minutes) {
    if (minutes % 60 === 0) return fmtHm(minutes);
    return fmtHm(minutes) + " (" + fmtNum(rhu(minutes * 100 / 60) / 100) + " hr)";
  }
  /* THE GOAL RULE (change it here, and in goal_plan in the Python).
     Each machine's goal counts only for the time it ran:
       shift goal lbs = sum(machine goal lb/hr x machine run hours)
       goal lb/hr for the sheet = shift goal lbs / net shift hours.
     One machine running the whole net shift reduces to that machine's own goal. */
  function goalPlan(run, netMin, steps, warnings, allNote) {
    if (!run.length) return [null, "", null];
    if (run.some(function (m) { return m.goal === null; })) return [null, "", null];
    var gsum = sum(run.map(function (m) { return m.goal * m.runMin; }));
    if (gsum <= 0) { warnings.push("No machine has any run time left. Check the run times and downtime."); return [null, "", null]; }
    var goal10 = rhu(gsum * 10 / netMin);
    var text = goal10 % 10 === 0 ? fmtInt(Math.floor(goal10 / 10)) : fmtTenths(goal10);
    if (run.length === 1 && run[0].runMin === netMin) {
      steps.push("Goal: " + run[0].name + " goal is " + fmtInt(run[0].goal) + " lb/hr.");
      return [goal10, text, gsum];
    }
    run.forEach(function (m) { steps.push((m.label || m.name) + " ran " + fmtHrs(m.runMin) + " \u00d7 " + fmtInt(m.goal) + " = " + fmtInt(m.goalLbs) + " lb."); });
    var line = "Your goal for the shift: " + fmtInt(rhu(gsum / 60)) + " lb. Spread over " + fmtHrs(netMin) + " = " + fmtTenths(goal10) + " lb/hr.";
    if (run.length > 1 && allNote !== false) line += " (If " + (run.length === 2 ? "both" : "all " + run.length) + " ran all shift it would be " +
      fmtInt(sum(run.map(function (m) { return m.goal; }))) + " lb/hr.)";
    steps.push(line);
    return [goal10, text, gsum];
  }
  function clock(s) {

      (r.problems.length ? '<ul style="padding-left:20px;margin:0;color:var(--white);line-height:1.45">' + r.problems.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + '</ul>' : '<p class="muted" style="margin:0">None entered. Add downtime on the Time screen.</p>') +
      '<div class="f" style="margin-top:12px"><label for="maint">Maintenance issues to follow up on</label><textarea id="maint" placeholder="maintenance issues, like leaking hose">' + esc(S.maintenance) + '</textarea></div></div>';
    html += '<button class="big solid" id="to-sheet" type="button" style="margin-top:8px">COPY TO SHEET VIEW (BIG TEXT)</button>';
    html += '<button class="big warn" id="new-shift" type="button" style="margin-top:22px">START A NEW SHIFT (CLEAR ALL)</button>';
    return html;
  }
  function bindResults() {
    var r = calc().res, pick = function (cats) { return r.steps.filter(function (s) { return cats.indexOf(cat(s)) >= 0; }); };
    $("n-total").onclick = function () { drill("Total Weight Produced", r.total ? P.fmtInt(r.total) + " lb" : "", pick(["total"])); };
    $("n-hours").onclick = function () { drill("Hours per shift", r.hours !== null ? r.hoursText + " hr (" + r.hmText + ")" : "", pick(["hours"])); };
    $("n-goal").onclick = function () { drill("Goal: Lbs/Hour", r.goal10 !== null ? r.goalText + " lb/hr" : "", pick(["goal"])); };
    $("n-rate").onclick = function () { drill("Average Lbs/per Hour", r.rate10 !== null ? r.rateText + " lb/hr" : "", pick(["rate", "status"])); };
    if ($("n-status")) $("n-status").onclick = function () { drill(r.status === "met" ? "GOAL MET" : "GOAL NOT MET", "", pick(["status"])); };
    (r.machineTotals || []).forEach(function (m, i) {
      var b = $("n-m" + i); if (!b) return;
      b.onclick = function () {
        drill(m.name, m.rate10 !== null ? P.fmtTenths(m.rate10) + " lb/hr" : "", r.steps.filter(function (s) { return s.indexOf(m.name + " ") === 0 && cat(s) !== "total"; }));
      };
    });
    $("maint").addEventListener("input", function (e) { S.maintenance = e.target.value; save(); });
    $("to-sheet").onclick = openSheet;
    $("new-shift").onclick = function () {
      if (!confirm("Clear everything and start a new shift?")) return;
      S = fresh(); S.screen = "log"; moveOpen = {}; render(); toast("Cleared");
    };
  }

  /* ---------- copy-to-sheet view, same order as the paper form ---------- */
  function openSheet() {
    var c = calc(), sh = c.sh, r = c.res, one = usedNames().length === 1 ? usedNames()[0] : "";
    var line = function (l, v, big) { return '<div class="svline' + (big ? " big" : "") + '"><span>' + l + '</span><b>' + esc(v) + '</b></div>'; };
    var h = line("Name", S.name || "") + line("Date", S.date || "") + line("Shift", S.shift || "");
    sh.rows.forEach(function (row, i) {
      var rr = r.rows[i];
      var cells = [["Card #", row.card], ["Finish Size", row.finish], ["Grade", row.grade], ["Draw Compound", row.compound], ["Package", row.package],
        ["Avg. Wgt.", rr.avg !== null ? P.fmtInt(rr.avg) : ""], ["Coils Drawn", rr.coilsText], ["Weight", rr.weight !== null ? P.fmtInt(rr.weight) : ""],
        ["Machine", row.machine || one]];
      h += '<div class="svrow"><div class="cells">' + cells.map(function (x) { return '<div><i>' + x[0] + '</i><b>' + esc(x[1] || "\u2013") + '</b></div>'; }).join("") + '</div></div>';
    });
    h += line("Total Weight Produced", r.total ? P.fmtInt(r.total) : "", true) + line("Hours per shift", r.hours !== null ? r.hoursText : "", true) +
      line("Goal: Lbs/Hour", r.goalText, true) + line("Average Lbs/per Hour", r.rateText, true);
    if (r.status === "notmet") h += '<h3 class="bad">GOAL NOT MET: LIST ALL PROBLEMS AND REASONS FOR DOWNTIME</h3>';
    else h += '<h3>List all problems and reasons for downtime</h3>';
    h += r.problems.length ? '<ul class="svlist">' + r.problems.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + '</ul>' : '<p class="svp">(none entered)</p>';
    h += '<h3>Maintenance issues to follow up on</h3><p class="svp">' + esc(r.maintenance || "(none entered)") + '</p>';
    $("sv-body").innerHTML = h; if (window.LogDB) LogDB.mount($("sv-body"), function () { return LogDB.fromTryout(S, calc()); }); $("sheetview").hidden = false; document.body.classList.add("noscroll"); $("sv-close").focus();
  }
  $("sv-close").onclick = function () { $("sheetview").hidden = true; document.body.classList.remove("noscroll"); };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closeDrill(); $("sv-close").onclick(); } });

  render();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>
